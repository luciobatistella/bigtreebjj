<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Big Tree BJJ — The Global Jiu-Jitsu Lineage Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;600;800;900&family=Oswald:wght@500;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0A09; --bark:#121310; --bark-2:#1A1C16;
  --moss:#1E3320; --moss-lo:#16241A;
  --gold:#C8A24A; --gold-hi:#E8CE86;
  --bone:#EFEAE0; --bone-dim:#A9A497; --blood:#C1272D;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --gut:clamp(20px,5vw,72px);
  --rule:1px solid rgba(200,162,74,.22);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--f-body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}

.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:0 0 18px}
.h-xl{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,8.2vw,112px);line-height:.86;text-transform:uppercase;margin:0;color:var(--bone)}
.h-sec{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,5vw,62px);line-height:.92;text-transform:uppercase;margin:0 0 16px}
.lede{font-size:clamp(17px,2vw,21px);color:var(--bone-dim);max-width:62ch;margin:0}
.lede strong{color:var(--bone);font-weight:600}

.beltrule{height:16px;width:100%;position:relative;background:linear-gradient(180deg,#1b1b19,#0d0d0c 55%,#161614);border-top:1px solid rgba(0,0,0,.7);border-bottom:1px solid rgba(255,255,255,.05);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 1px,transparent 1px 4px)}
.beltrule::after{content:"";position:absolute;right:8%;top:0;bottom:0;width:74px;background:var(--blood);box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}

.seal{display:inline-flex;align-items:center;gap:9px;vertical-align:middle}
.seal__bar{display:inline-flex;align-items:center;gap:2px;background:var(--blood);padding:3px 4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.07)}
.seal__bar i{width:2px;height:13px;background:var(--bone);display:block}
.seal__txt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-dim)}
.seal--sm .seal__bar{padding:2px 3px}
.seal--sm .seal__bar i{height:9px}

.nav{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;align-items:center;gap:20px;padding:12px var(--gut);background:rgba(10,10,9,.72);backdrop-filter:blur(14px);border-bottom:var(--rule);transform:translateY(-102%)}
.nav.is-on{transform:none;transition:transform .45s cubic-bezier(.2,.7,.3,1)}
.nav__mark{width:34px;height:34px;flex:none;border-radius:50%}
.nav__name{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:19px;line-height:1}
.nav__links{margin-left:auto;display:flex;gap:22px}
.nav__links a{font-family:var(--f-mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--bone-dim);text-decoration:none;padding:6px 0;border-bottom:1px solid transparent}
.nav__links a:hover,.nav__links a:focus-visible{color:var(--gold);border-bottom-color:var(--gold)}
.lang{display:flex;gap:2px;margin-left:auto;border:1px solid rgba(200,162,74,.3)}
.nav__links ~ .lang{margin-left:24px}
.lang button{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;background:transparent;border:0;color:var(--bone-dim);padding:8px 11px;cursor:pointer;transition:background .2s,color .2s}
.lang button:hover{color:var(--bone)}
.lang button[aria-current="true"]{background:var(--gold);color:var(--ink)}
@media(max-width:900px){.nav__links{display:none}.lang{margin-left:auto}}

.hero{min-height:100svh;display:grid;place-items:center;text-align:center;padding:88px var(--gut) 56px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-30% 50% auto 50%;width:min(1100px,150vw);aspect-ratio:1;transform:translateX(-50%);background:radial-gradient(circle,rgba(30,51,32,.85) 0%,rgba(30,51,32,.18) 42%,transparent 68%);pointer-events:none}
.hero__in{position:relative;max-width:980px;width:100%}
.hero__emblem{width:min(300px,52vw);margin:0 auto 30px;filter:drop-shadow(0 22px 60px rgba(0,0,0,.85))}
.hero__sub{margin:24px auto 0;max-width:60ch;color:var(--bone-dim);font-size:clamp(16px,2vw,20px)}
.hero__seals{display:flex;flex-wrap:wrap;gap:10px 26px;justify-content:center;margin:34px 0 0;padding:18px 0 0;border-top:var(--rule)}
.hero__cta{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:34px}
.btn{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:14px 26px;text-decoration:none;border:1px solid var(--gold);color:var(--gold);background:transparent;cursor:pointer;transition:background .25s,color .25s;display:inline-block}
.btn:hover,.btn:focus-visible{background:var(--gold);color:var(--ink)}
.btn--solid{background:var(--gold);color:var(--ink)}
.btn--solid:hover,.btn--solid:focus-visible{background:var(--gold-hi)}
.btn--ghost{border-color:rgba(239,234,224,.28);color:var(--bone-dim)}
.btn--ghost:hover,.btn--ghost:focus-visible{background:transparent;border-color:var(--bone);color:var(--bone)}

.sec{padding:clamp(72px,10vw,140px) var(--gut)}
.sec--moss{background:linear-gradient(180deg,var(--moss-lo),#111310)}
.sec__head{max-width:1220px;margin:0 auto clamp(38px,5vw,64px)}
.wrap{max-width:1220px;margin:0 auto}

.seals{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:rgba(200,162,74,.2)}
.seals__c{background:var(--bark);padding:28px 24px 30px}
.seals__c h3{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:26px;margin:16px 0 8px}
.seals__c p{margin:0;font-size:15.5px;color:var(--bone-dim);line-height:1.6}
.seals__c .kbd{font-family:var(--f-mono);font-size:11px;color:var(--gold);letter-spacing:.12em}

.treewrap{position:relative;overflow-x:auto;overflow-y:hidden;padding-bottom:8px}
.tree{position:relative;width:100%;min-width:940px;aspect-ratio:1000/760}
.tree__svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.link{fill:none;stroke:rgba(200,162,74,.42);stroke-width:1.6}
.link--claim{stroke:rgba(193,39,45,.6);stroke-dasharray:6 5}
.node{position:absolute;transform:translate(-50%,-50%);background:var(--bark-2);border:1px solid rgba(200,162,74,.3);padding:9px 14px;min-width:132px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}
.node:hover,.node:focus-visible{border-color:var(--gold);background:#22251C;outline:none;transform:translate(-50%,-50%) translateY(-2px)}
.node.is-sel{border-color:var(--gold-hi);background:#2A2A1E;box-shadow:0 0 0 1px var(--gold-hi)}
.node__n{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:17px;line-height:1.05;display:block}
.node__m{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;color:var(--bone-dim);margin-top:3px;text-transform:uppercase;display:block}
.node--root{background:var(--moss);border-color:var(--gold)}
.node.is-pending{border-style:dashed}
.node.is-pending .node__m::after{content:" ·";color:var(--blood)}

.legend{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:26px;padding-top:20px;border-top:var(--rule)}
.legend span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--bone-dim);display:inline-flex;align-items:center;gap:9px}
.legend i.swatch{width:30px;height:2px;background:rgba(200,162,74,.6);display:block}
.legend i.swatch--claim{background:none;border-top:2px dashed rgba(193,39,45,.85)}

.drawer{position:fixed;top:0;right:0;height:100svh;width:min(440px,92vw);z-index:80;background:var(--bark);border-left:1px solid rgba(200,162,74,.3);padding:28px 28px 40px;overflow-y:auto;transform:translateX(101%);transition:transform .4s cubic-bezier(.2,.7,.3,1);box-shadow:-30px 0 70px rgba(0,0,0,.6)}
.drawer.is-open{transform:none}
.drawer__x{position:absolute;top:16px;right:18px;background:none;border:1px solid rgba(239,234,224,.25);color:var(--bone-dim);font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;padding:7px 12px;cursor:pointer}
.drawer__x:hover{color:var(--bone);border-color:var(--bone)}
.drawer h3{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:34px;line-height:.95;margin:26px 0 6px}
.drawer .dates{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin:0 0 20px}
.drawer dl{margin:22px 0 0;border-top:var(--rule);padding-top:16px}
.drawer dt{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-dim);margin-top:14px}
.drawer dd{margin:5px 0 0;font-size:15.5px;line-height:1.55}
.drawer dt.gap{color:var(--blood)}

.chron{border-top:var(--rule)}
.chron__r{display:grid;grid-template-columns:150px 1fr 190px;gap:26px;align-items:start;padding:26px 0;border-bottom:var(--rule)}
.chron__y{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--gold)}
.chron__t{margin:0;font-size:16.5px;color:var(--bone-dim)}
.chron__t b{color:var(--bone);font-weight:600}
@media(max-width:760px){.chron__r{grid-template-columns:1fr;gap:10px}.chron__y{font-size:26px}}

.led{display:grid;gap:1px;background:rgba(200,162,74,.2);border:1px solid rgba(200,162,74,.2)}
.led__r{background:var(--bark);padding:22px 24px;display:grid;grid-template-columns:78px 1fr 1fr;gap:24px}
.led__id{font-family:var(--f-mono);font-size:12px;color:var(--blood);letter-spacing:.1em}
.led__o{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:20px;line-height:1.05;margin:0}
.led__v{margin:8px 0 0;font-size:14.5px;color:var(--bone-dim)}
.led__v em{color:var(--gold);font-style:normal;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:3px}
@media(max-width:800px){.led__r{grid-template-columns:1fr;gap:12px}}

.offer{max-width:1220px;margin:0 auto;display:grid;grid-template-columns:1.15fr .85fr;gap:1px;background:rgba(200,162,74,.25);border:1px solid rgba(200,162,74,.25)}
.offer__l,.offer__r{background:var(--bark);padding:clamp(30px,4vw,52px)}
.offer__r{background:var(--moss-lo)}
.offer ul{list-style:none;padding:0;margin:22px 0 0}
.offer li{padding:11px 0 11px 26px;position:relative;border-bottom:1px dashed rgba(239,234,224,.12);font-size:15.5px;color:var(--bone-dim)}
.offer li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:3px;background:var(--blood)}
.price{font-family:var(--f-display);font-weight:900;font-size:clamp(46px,6vw,76px);line-height:1;margin:8px 0 4px}
.price small{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--bone-dim);display:block;margin-top:12px;text-transform:uppercase;font-weight:400}
.fineprint{margin-top:22px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-dim)}
@media(max-width:860px){.offer{grid-template-columns:1fr}}

.foot{padding:44px var(--gut) 60px;border-top:var(--rule);display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.foot p{margin:0;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-dim)}
.foot img{width:44px;border-radius:50%}

.reveal{opacity:0}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1}*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>

const TREE_EDGES = [["kodokan", "maeda", "ATE"], ["maeda", "ferro", "DOC"], ["maeda", "carlos", "TRA"], ["maeda", "franca", "TRA"], ["maeda", "aleixo", "TRA"], ["maeda", "donato", "TRA"], ["ferro", "donato", "DOC"], ["ferro", "carlos", "DOC"], ["donato", "carlos", "ATE"], ["satake", "franca", "ATE"], ["omori", "franca", "ATE"], ["franca", "fadda", "ATE"], ["kano", "kodokan", "ATE"], ["maeda", "lopes", "DOC"], ["maeda", "gomes", "DOC"], ["maeda", "delarocque", "DOC"], ["maeda", "pereira", "DOC"], ["maeda", "bianor", "TRA"], ["satake", "ruas", "ATE"], ["carlos", "helio", "ATE"], ["carlos", "george", "ATE"], ["carlos", "oswaldo", "ATE"], ["carlos", "gastaojr", "ATE"], ["donato", "acad1930", "DOC"], ["carlos", "acad1930", "DOC"], ["george", "acad1930", "DOC"], ["donato", "george", "ATE"], ["gastaopai", "maeda", "TRA"], ["helio", "santana", "ATE"], ["carlos", "carlson", "ATE"], ["carlos", "robson", "ATE"], ["helio", "federacao_guanabara", "ATE"], ["fadda", "federacao_guanabara", "ATE"], ["carlson", "federacao_guanabara", "ATE"], ["helio", "rorion", "ATE"], ["helio", "royce", "ATE"], ["carlos", "carlosjr", "ATE"], ["rorion", "ufc", "ATE"], ["carlosjr", "ibjjf", "ATE"], ["barretojoao", "ufc", "ATE"]];
const TREE_VERBETES_PT = {"ruas": {"n": "Vinicius Ruas", "m": "", "v": "Aluno de Satake em Manaus que seguiu pelo caminho institucional do judô, e não pelo do jiu-jitsu — o que ilustra como as duas coisas ainda eram a mesma até a separação se consolidar.", "o": "É tio de um lutador que se tornaria conhecido no vale-tudo e no MMA décadas depois, o que mostra que a rede formada em Manaus reaparece em pontos inesperados da história posterior.", "g": "Datas, período de treino com Satake e circunstâncias da migração para o judô institucional."}, "omori": {"n": "Geo Omori", "m": "", "v": "O professor japonês de São Paulo, e uma das duas testemunhas contemporâneas que contradisseram publicamente a versão oficial sobre a formação de Carlos Gracie.", "o": "Declarou publicamente que Carlos Gracie não havia sido instruído diretamente por Maeda. É testemunho de adversário — tem peso probatório real, mas com interesse na disputa, e a obra registra o viés em vez de escondê-lo.", "g": "Origem, formação, datas, e o destino após o período paulista."}, "robson": {"n": "Robson Gracie", "m": "", "v": "Entrou na fundação da primeira federação como o cargo mais júnior do organograma da família, e décadas depois se tornaria a figura mais longeva na presidência da mesma entidade, já sob outro nome.", "o": "A trajetória dele amarra o início e o presente desta obra num único fio: o mesmo nome que assina o organograma de fundação, ao lado do professor do subúrbio, reaparece décadas depois no comando da entidade sucessora — e disputas por essa mesma presidência seguem ativas até a atualidade, entre membros da geração seguinte da família.", "g": "Datas de nascimento e morte. A cronologia exata de sua presidência: início, duração e circunstâncias da sucessão."}, "kano": {"n": "Jigoro Kano", "m": "", "v": "O homem que transformou um conjunto disperso de escolas de combate numa pedagogia exportável. Sem essa reorganização, nada do que veio depois no Brasil teria acontecido — nem os japoneses teriam saído do Japão com uma missão de difusão nas costas.", "o": "O detalhe que a bibliografia brasileira quase sempre omite: o que os japoneses trouxeram ao Brasil no início do século era o sistema dele, e era chamado indistintamente de jiu-jitsu ou de judô pela imprensa da época. A separação entre as duas coisas é posterior e brasileira, não japonesa.", "g": "A relação pessoal dele com cada enviado, e o grau em que a missão de difusão foi política de Estado ou iniciativa individual dos discípulos."}, "gastaojr": {"n": "Gastão Gracie Jr.", "m": "", "v": "Um dos irmãos da segunda geração, na mesma condição documental do anterior.", "o": "Registrado aqui para que a enumeração da segunda geração fique completa e para que a assimetria de tratamento entre os irmãos seja visível na própria base.", "g": "Todos os campos além do vínculo familiar e do parentesco de formação."}, "carlosjr": {"n": "Carlos Gracie Jr.", "m": "Carlinhos", "v": "Construiu, a partir de uma associação local de torneios, a estrutura que transformaria o jiu-jitsu de disputa doméstica de linhagem em esporte com calendário, ranking e economia próprios.", "o": "A trajetória dele fecha um ciclo que começou com a primeira academia do país: assim como aquela precisou de um diretor não pertencente à família para nascer, a esportivização plena da arte, um século depois, teve como arquiteto um membro direto da terceira geração — o pêndulo entre organização institucional e propriedade familiar do jiu-jitsu completa uma volta inteira.", "g": "Datas exatas de fundação da confederação nacional e da federação internacional divergem entre fontes secundárias quanto a se nasceram no mesmo ano ou anos depois uma da outra."}, "carlson": {"n": "Carlson Gracie", "m": "", "v": "Entrou na história como o filho chamado para restaurar a honra da família depois da derrota do tio, e décadas mais tarde ocupou um dos postos técnicos da primeira federação da modalidade — a mesma em que o suburbano rival da família também tinha assento.", "o": "Sua presença no mesmo organograma de fundação que o professor de origem humilde é o mesmo dado que já apareceu no verbete de Fadda, visto agora do outro lado: aos olhos da nova federação, linhagem de elite e linhagem de subúrbio ocupavam a mesma mesa de fundação, ainda que décadas antes uma tivesse tratado a outra como forasteira.", "g": "Datas de nascimento e morte. A sequência exata dos combates contra o rival da família: número de encontros, datas e resultados divergem entre as fontes secundárias consultadas."}, "royce": {"n": "Royce Gracie", "m": "", "v": "Escolhido para representar a família num torneio contra lutadores de outros estilos justamente por não ser o mais decorado nem o mais forte fisicamente dos irmãos — a lógica era provar que a técnica, não o físico, decidia o confronto.", "o": "É a inversão exata do argumento usado décadas antes contra o subúrbio: ali, o menor e mais pobre venceu por especialização técnica; aqui, o menor e mais leve da própria elite vence pelo mesmo princípio, só que diante das câmeras do mundo inteiro. A arte que nasceu provando que tamanho não decide voltou a provar o mesmo ponto, numa escala completamente diferente.", "g": "Datas de nascimento, formação técnica detalhada, cronologia completa de combates."}, "bianor": {"n": "Bianor Oliveira", "m": "", "v": "Nome que circula na bibliografia como possível aluno de Maeda, sem que nenhuma fonte apresente base para a afirmação.", "o": "Entra na obra pelo mesmo motivo que Mário Aleixo: o conjunto de pessoas que reivindicaram Maeda como professor é maior que o conjunto de pessoas que ele comprovadamente formou, e essa diferença é um dado histórico sobre o valor de mercado do nome do japonês.", "g": "Todos os campos."}, "santana": {"n": "Waldemar Santana", "m": "Leopardo Negro", "v": "Começou como funcionário da academia da família, tornou-se aluno, virou parceiro de treino dos mais graduados e terminou como o homem que protagonizou a luta mais longa já registrada nesta arte — derrotando o próprio mestre que o expulsara.", "o": "É o primeiro grande rival da família a sair de dentro da própria casa, e sua trajetória inverte a lógica de todos os outros conflitos desta obra: aqui não há disputa sobre quem foi aluno de quem — isso é incontestado — mas sobre o que aconteceu depois que o aluno venceu o mestre.", "g": "Datas de nascimento e morte. Duração exata do combate com Hélio, que varia por poucos minutos entre fontes. Número exato e resultado de cada um dos combates posteriores contra o filho do líder da família — a bibliografia secundária diverge de forma considerável nesse ponto."}, "gomes": {"n": "Raphael Gomes", "m": "", "v": "Promovido por Maeda na mesma cerimônia que Ferro. Nome sem biografia.", "o": "A grafia do prenome varia entre fontes, o que sugere que nenhuma delas consultou registro primário.", "g": "Datas, origem, trajetória posterior à promoção e eventuais alunos."}, "ufc": {"n": "Ultimate Fighting Championship", "m": "", "v": "O evento de estreia converteu uma disputa doméstica de linhagem brasileira num mercado global de artes marciais mistas — e, sem que a maior parte do público percebesse, colocou no papel de árbitro um nome que já constava do organograma de fundação da primeira federação da modalidade, quase três décadas antes.", "o": "Um dos dois árbitros do evento de estreia era veterano de arbitragem de vale-tudo brasileiro, e constava, quase trinta anos antes, do organograma de fundação da primeira federação de jiu-jitsu do mundo, no cargo de diretor de educação. A rede de pessoas que institucionalizou o esporte no Brasil na época da primeira federação é, em parte, a mesma que o exportou décadas depois para o mercado americano.", "g": "Documentação societária completa da fundação e do contrato original entre os fundadores."}, "acad1930": {"n": "Academia de Jiu-Jitsu", "m": "", "v": "A primeira academia de jiu-jitsu do Brasil de que há registro. Foi dirigida por Donato Pires dos Reis, teve Carlos e George Gracie como professores, e pouco depois passaria a levar o nome da família.", "o": "O detalhe que desmonta a leitura purista: ela não era uma academia de jiu-jitsu. Oferecia também capoeira e boxe. Era um ginásio de esportes de combate, o que faz muito mais sentido para o mercado da época do que a imagem retrospectiva de um templo dedicado a uma arte única. A especialização veio depois, junto com a marca.", "g": "Data exata da mudança de nome e da saída de Donato da direção."}, "fadda": {"n": "Oswaldo Fadda", "m": "", "v": "Recebeu de Luiz França uma linhagem sem marca, sem clã e sem imprensa, e a manteve viva sozinho no subúrbio carioca até que ela produzisse campeões mundiais. O forasteiro de uma década virou cofundador da federação na seguinte.", "o": "Desafiou a Academia Gracie e sua equipe venceu, justamente pelas chaves de pé. Hélio Gracie admitiu à imprensa que bastava um Fadda para mostrar que o jiu-jitsu não era privilégio dos Gracie. Dezessete anos depois, o mesmo suburbano tratado como de fora seria cofundador da federação que esportivizou a arte, ocupando o cargo de primeiro vice-técnico ao lado dos Gracie.", "g": "Cadeia de graduações entre ele e os fundadores das equipes que hoje reivindicam a linhagem, ainda não montada nó a nó."}, "pereira": {"n": "Matheus Pereira", "m": "", "v": "Promovido por Maeda na mesma cerimônia que Ferro, e o único dos cinco tratado pelas fontes com título profissional — o que sugere alguém de formação superior e posição social distinta da dos colegas.", "o": "O tratamento por título é a única textura social que temos sobre a turma de Belém, e sugere que a academia de Maeda atendia elite profissional local, não apenas praticantes de origem popular. Se confirmado, muda a leitura sobre que público o jiu-jitsu tinha no Pará.", "g": "Qual profissão, datas, trajetória posterior e eventuais alunos."}, "maeda": {"n": "Mitsuyo Maeda", "m": "Conde Koma", "v": "A fonte técnica de onde brota a linhagem brasileira dominante — e, ao mesmo tempo, o nome mais reivindicado e menos documentado da história do jiu-jitsu no Brasil. Ensinou dezenas de pessoas; a bibliografia lembra de duas, e das duas nenhuma tem vínculo comprovado com ele.", "o": "Que ele tenha ensinado muita gente na América Latina é certo; que o ensino tenha se enraizado no Brasil e não no México ou em Cuba é o fato que pede explicação, e a resposta não está nele — está nos brasileiros que assumiram a instrução na ausência dele.", "g": "Itinerário completo da missão de difusão, com registros de imigração e imprensa local de cada país. É material farto e praticamente inexplorado em português."}, "ferro": {"n": "Jacyntho Ferro", "m": "", "v": "O elo. Principal aluno brasileiro de Maeda, instrutor da academia de Belém na ausência do mestre, e professor documentado das duas figuras que fundariam a primeira academia do país. A narrativa consagrada o apaga porque a existência dele quebra a linha reta entre o Japão e o sobrenome Gracie.", "o": "Morreu antes que qualquer disputa pública sobre linhagem se instalasse, e não deixou família nem academia que defendesse seu nome. Não fossem alguns artigos de jornal, teria desaparecido por completo. É o exemplo mais limpo de como a história aqui foi escrita por quem sobreviveu com aparato de imprensa.", "g": "Datas e local de nascimento, trajetória anterior à academia, circunstâncias da morte, e se deixou outros alunos além dos dois conhecidos."}, "yano": {"n": "Takeo Yano", "m": "", "v": "Um dos japoneses ativos no Brasil em paralelo ao eixo que a bibliografia consagrou. Entra nesta obra como nome a apurar, não como verbete estabelecido.", "o": "A obra registra a existência dele porque o desaparecimento coletivo dos japoneses que atuaram fora de Belém é, ele próprio, o objeto de estudo. Mas registrar existência não é escrever biografia, e esta entrada não pretende ser uma.", "g": "Todos os campos. Este verbete está aberto na íntegra."}, "aleixo": {"n": "Mário Aleixo", "m": "", "v": "O primeiro brasileiro a abrir um clube de jiu-jitsu no país — e fez isso antes de Maeda desembarcar. Terminou a trajetória pública sendo finalizado por um Gracie, o que resume simbolicamente a passagem de uma geração para a outra.", "o": "O caso dele é útil por um motivo metodológico: mostra que ser aluno de Maeda virou, no Brasil, uma credencial reivindicada retroativamente por praticamente todo pioneiro — inclusive por quem já ensinava antes de o mestre chegar. A reivindicação é um dado histórico sobre o mercado da época, não sobre a transmissão técnica.", "g": "Datas de nascimento e morte, formação real, localização e período de funcionamento do clube, e o que fez depois da derrota."}, "lopes": {"n": "Waldemar Lopes", "m": "", "v": "Um dos cinco brasileiros promovidos por Maeda na única cerimônia de graduação confirmada do mestre. Fora desse fato, a história não guardou nada dele.", "o": "Ele e os outros três colegas de cerimônia são a prova mais direta de que graduação não gera memória histórica. Quatro homens com o mesmo grau, no mesmo dia, do mesmo mestre que a bibliografia mundial venera — e nenhum deles tem biografia escrita.", "g": "Datas, origem, trajetória posterior à promoção e eventuais alunos."}, "federacao_guanabara": {"n": "Federação de Jiu-Jitsu da Guanabara", "m": "", "v": "A primeira federação da modalidade no mundo, e o documento organizacional mais revelador desta obra: no mesmo organograma, lado a lado, estão a elite da zona sul e o professor do subúrbio que ela havia tratado como forasteiro décadas antes.", "o": "O detalhe mais importante deste verbete não está em nenhuma frase isolada, mas na lista de cargos: presidência e conselho consultivo com a família que construiu a marca; departamento técnico com o filho mais talentoso dela; e logo abaixo, ocupando o posto de primeiro vice-técnico, o professor do subúrbio cuja equipe havia vencido a Academia Gracie por chaves de pé menos de duas décadas antes. A obra já registrou esse fato do lado de Fadda; aqui ele aparece do lado institucional — como política deliberada de unificação, não como coincidência de calendário.", "g": "A ata de fundação original não foi localizada por esta obra; tudo o que se sabe do organograma vem de fontes secundárias que convergem entre si, mas nenhuma delas é o documento primário. O ato normativo do reconhecimento legal como esporte também não foi identificado."}, "kato": {"n": "Yukio Kato", "m": "", "v": "A porta de entrada. Antes de qualquer duelo com o campeão japonês ser cogitado, a família Gracie teve de provar seu valor contra ele — o suficiente para virar nota de rodapé numa história que passou a girar inteiramente em torno de outro nome.", "o": "Sem essas duas lutas, a mais famosa não teria acontecido: foi a condição que a comitiva japonesa impôs, e foi a derrota dele que forçou o campeão a entrar pessoalmente na disputa. É a peça de abertura de uma sequência que se tornaria o evento mais coberto de toda a história do jiu-jitsu no Brasil.", "g": "Origem, formação completa, datas de nascimento e morte, e o que fez após a passagem pelo Brasil."}, "miyako": {"n": "Sada Miyako", "m": "", "v": "O primeiro professor japonês de jiu-jitsu de que há registro em solo brasileiro, e a figura que desloca o marco de origem da arte no país. Chegou contratado pelo Estado, não por uma família, e ensinou dentro de uma instituição pública.", "o": "A existência dele desmonta duas premissas de uma vez. A primeira é a de que o jiu-jitsu entrou no Brasil pelo Pará; a segunda, a de que o combate entre modalidades diferentes foi um formato inaugurado pelos Gracie. Ambas as coisas já aconteciam no Rio antes de Maeda desembarcar.", "g": "Origem, formação, datas de nascimento e morte, destino após os primeiros anos no Brasil. Não se sabe sequer se permaneceu no país."}, "danaher": {"n": "John Danaher", "m": "", "v": "Sistematizou, dentro de uma academia fundada por um neto do próprio Carlos Gracie, um método de ataques à perna que devolveria ao centro do esporte exatamente a especialidade que, setenta anos antes, havia custado ao subúrbio o desprezo da elite carioca.", "o": "Esta obra registra a conexão como observação editorial, não como fato de terceiros: a equipe que ele fundou, décadas depois, tornou dominante exatamente o conjunto de técnicas que a equipe do subúrbio já usava para vencer a Academia Gracie na era dos desafios — as mesmas chaves de pé que a elite carioca havia tratado como golpe menor. O currículo do professor sem marca, sem clã e sem imprensa acabou por se tornar, com meio século de atraso e por uma rota que não passa por sua linhagem direta, o estado da arte da competição de elite mundial.", "g": "Trajetória de formação técnica anterior à criação do próprio método. Datas exatas de nascimento."}, "rocha": {"n": "Edgard Rocha", "m": "", "v": "O esportista que perdeu a demonstração de abertura da primeira academia do país em pouco mais de dois minutos, cedendo mais de trinta quilos ao adversário. Perdeu, e por isso entrou para a história com nome e sobrenome.", "o": "É raro que o derrotado de uma demonstração seja nomeado pela imprensa; normalmente ele é um anônimo conveniente. Que este tenha nome, sobrenome e peso registrados sugere que era figura conhecida do meio esportivo carioca, e portanto rastreável. Identificar quem ele era muda a leitura do evento: uma coisa é vencer um voluntário da plateia, outra é vencer alguém que o público reconhecia.", "g": "Quem era, que esporte praticava, e o que fez depois."}, "ibjjf": {"n": "Confederação Brasileira de Jiu-Jitsu e Federação Internacional", "m": "", "v": "A estrutura que deu ao jiu-jitsu esportivo o que a Federação da Guanabara tinha dado a ele quase trinta anos antes em escala carioca: regras uniformes, calendário e um sistema de faixas — desta vez em escala mundial.", "o": "A entidade repete, em escala internacional e sob comando de um único ramo da família, o mesmo movimento que a Federação da Guanabara havia feito em sua fundação sob comando compartilhado entre vertentes rivais: transformar disputa de prestígio em estrutura de regras. A diferença está em quem senta à mesa — ali, elite e subúrbio dividiam o organograma; aqui, a organização nasce e permanece sob um único ramo familiar.", "g": "Se a confederação nacional e a federação internacional nasceram no mesmo ano ou em momentos distintos: fontes secundárias divergem."}, "gastaopai": {"n": "Gastão Gracie", "m": "", "v": "O pai dos irmãos Gracie, e a viga que sustenta toda a narrativa tradicional de origem. Se a amizade dele com o mestre japonês não existiu como se conta, a versão oficial perde o seu ponto de partida.", "o": "A narrativa consagrada funciona assim: o pai faz amizade com o japonês, o japonês retribui ensinando o filho mais velho. É uma história de gratidão pessoal, não de matrícula em academia — e por isso mesmo nunca precisou de comprovante. Nenhuma fonte consultada apresenta documento dessa relação. Sendo ele figura de negócios numa cidade com imprensa ativa, o silêncio documental é ele próprio um dado.", "g": "Datas, ramo de atividade, e qualquer registro da relação com o mestre japonês."}, "franca": {"n": "Luiz França", "m": "", "v": "Fundador da principal linhagem não-Gracie do jiu-jitsu brasileiro. Ensinou por décadas dentro de uma instituição que arquiva tudo, e não deixou papel — o que diz mais sobre como a história foi escrita do que sobre ele.", "o": "Sua atuação como precursor do sistema de defesa pessoal do Corpo de Fuzileiros Navais nunca foi registrada na administração esportiva da Marinha, sobrevivendo apenas como relato oral de antigos alunos. É a explicação mais econômica para o vazio documental: ele ensinou à margem do organograma, e não gerou papel. Os Gracie, ao contrário, viviam de imprensa.", "g": "Local de nascimento em disputa entre dois estados. A cronologia do início do treino é internamente contraditória: uma versão o colocaria treinando ainda criança, outra na adolescência, e as duas não podem estar certas."}, "helio": {"n": "Hélio Gracie", "m": "", "v": "O irmão mais novo, que se tornaria o rosto público da família e o reformador técnico da arte — e cuja formação é a prova mais limpa de que a linha reta entre o Japão e o sobrenome Gracie é uma compressão.", "o": "A cadeia tradicional coloca o mestre japonês, depois o irmão mais velho, depois ele. O segundo elo é contestado por documento e o terceiro nunca encontrou o primeiro. Vale registrar que foi ele quem, depois de perder o desafio para a equipe do subúrbio, admitiu à imprensa que bastava um adversário daqueles para mostrar que a arte não era privilégio da família — declaração que, vinda de quem veio, é a concessão mais significativa de toda esta história.", "g": "Datas de nascimento e morte circulam sem que nenhuma fonte aponte registro civil."}, "george": {"n": "George Gracie", "m": "", "v": "O irmão que mais lutou e que pior encaixa na narrativa oficial da família — porque trabalhou como assistente do homem que a versão consagrada trata como figura menor.", "o": "O detalhe que a bibliografia de linhagem nunca explora: se Donato era o coadjuvante que a versão familiar sugere, por que um Gracie foi trabalhar como assistente dele quase uma década depois da separação? Um homem sem prestígio técnico não contrata um Gracie como auxiliar, nem um Gracie aceita o posto.", "g": "Datas de nascimento e morte, e a cronologia completa dos combates públicos."}, "carlos": {"n": "Carlos Gracie", "m": "", "v": "Arquiteto da dinastia que levaria o jiu-jitsu brasileiro ao mundo, e centro da disputa historiográfica mais importante da arte: de quem, afinal, ele aprendeu.", "o": "A alegação de discipulado direto não é invenção do nada: é uma compressão, que apaga dois intermediários brasileiros e liga o nome ao Japão em linha reta. Vale lembrar que era argumento comercial. Numa época em que legitimidade se media por proximidade com mestres japoneses, encurtar a linhagem valia dinheiro.", "g": "A data do retorno ao Rio diverge entre a biografia familiar e as fontes de imprensa do período, com cinco anos de diferença — e esses cinco anos são justamente o intervalo em que a formação teria acontecido."}, "binda": {"n": "Hélcio Leal Binda", "m": "", "v": "Uma das cinco lideranças fundadoras da primeira federação da modalidade, na mesma condição documental de Álvaro Barreto.", "o": "Registrado para que a lista dos cinco fundadores permaneça completa nesta base, ainda que sem desenvolvimento biográfico.", "g": "Todos os campos além da participação na fundação."}, "oswaldo": {"n": "Oswaldo Gracie", "m": "", "v": "Um dos irmãos da segunda geração, presente em toda lista da família e ausente de toda narrativa.", "o": "A família é sempre citada como um bloco de irmãos, mas a bibliografia só desenvolve dois deles. Os outros existem como nomes numa enumeração, o que reproduz dentro do próprio clã o mesmo apagamento que ele praticou para fora.", "g": "Todos os campos além do vínculo familiar e do parentesco de formação."}, "kakihara": {"n": "M. Kakihara", "m": "", "v": "Chegou ao Brasil no mesmo navio e no mesmo contrato que Sada Miyako, e sobreviveu na história como um sobrenome e uma inicial. É o nome mais apagado de toda esta obra.", "o": "Que dois professores tenham chegado juntos, sob o mesmo contrato, e que apenas um deles tenha deixado qualquer rastro narrativo, é em si um dado sobre como esta história foi conservada: sobrou quem apareceu em ringue e em teatro, não quem apenas deu aula.", "g": "Tudo. Prenome, origem, formação, período de permanência no Brasil e destino."}, "rorion": {"n": "Rorion Gracie", "m": "", "v": "Levou o ensino da família para fora do Brasil e, uma geração depois, criou o evento que faria pela imagem internacional da arte o que a demonstração de abertura da primeira academia tinha feito localmente: uma vitrine pública desenhada para provar um ponto.", "o": "A lógica do evento que ele ajudou a criar é a mesma lógica dos desafios públicos que a família cultivava desde a fundação da primeira academia: colocar o menor contra o maior, em público, e deixar o resultado falar. Só que desta vez o palco era o mundo inteiro, transmitido, e não apenas um Estado.", "g": "Datas de nascimento, trajetória completa nos primeiros anos nos Estados Unidos antes da criação do torneio."}, "barretoalvaro": {"n": "Álvaro Barreto", "m": "", "v": "Uma das cinco lideranças fundadoras da primeira federação da modalidade, e um nome que a bibliografia registra no organograma sem nunca desenvolver.", "o": "É o quinto nome de um grupo de cinco em que dois já têm biografia desenvolvida nesta obra e os outros três permanecem apenas como assinatura num organograma. A assimetria de tratamento entre os fundadores é, ela mesma, um retrato de como a memória do esporte se organizou em torno de poucos sobrenomes.", "g": "Todos os campos além da participação na fundação."}, "delarocque": {"n": "Guilherme DelaRocque", "m": "", "v": "Promovido por Maeda na mesma cerimônia que Ferro. O sobrenome, incomum, é a melhor pista de busca disponível sobre ele.", "o": "O sobrenome aparece grafado de ao menos duas formas na bibliografia, junto e separado. Fixar a grafia correta em registro primário é pré-requisito para qualquer busca em acervo.", "g": "Datas, origem, grafia canônica do nome, trajetória posterior e eventuais alunos."}, "barretojoao": {"n": "João Alberto Barreto", "m": "", "v": "Aparece duas vezes nesta obra antes de ter verbete próprio: como um dos graduados a quem o funcionário rebelde da academia servia de parceiro de treino, e como diretor de educação na fundação da primeira federação.", "o": "A recorrência do nome em dois momentos distintos — como parceiro de treino informal e depois como dirigente formal — sugere uma trajetória de confiança dentro do círculo mais próximo da família, mas esta obra não reconstruiu os anos entre um episódio e outro.", "g": "Toda a trajetória entre servir de parceiro de treino e assumir cargo de diretoria."}, "barradas": {"n": "Orlando Barradas", "m": "", "v": "Ocupou o segundo posto técnico da federação recém-fundada, um degrau abaixo do professor do subúrbio — o que situa, lado a lado num mesmo organograma, dois nomes de origens muito diferentes dentro da hierarquia técnica mais alta da nova entidade.", "o": "Como os demais fundadores menos documentados, sua presença no organograma é o único fato firme que esta obra pôde estabelecer sobre ele.", "g": "Todos os campos além do cargo na fundação."}, "satake": {"n": "Soshihiro Satake", "m": "", "v": "O professor japonês do norte do Brasil de quem parte o vínculo mais firme da linhagem não-Gracie. Ensinou em Manaus enquanto Maeda ensinava em Belém, e a bibliografia de linhagem trata os dois como se fossem um só.", "o": "É a figura que desfaz a ideia de um funil único. Havia mais de um professor japonês ensinando no norte do Brasil ao mesmo tempo, em cidades diferentes, e a linhagem que sobreviveu fora do eixo Gracie veio de Manaus, não de Belém.", "g": "Datas de nascimento e morte, chegada e saída do Brasil, e a escola de origem."}, "donato": {"n": "Donato Pires dos Reis", "m": "", "v": "Dirigiu a primeira academia de jiu-jitsu do Brasil de que há registro, com Carlos e George Gracie trabalhando como seus professores. Poucos anos depois havia sumido da narrativa oficial, e a academia levava outro nome.", "o": "Contestou publicamente, na imprensa carioca, a versão de que Carlos teria sido aluno de Maeda. É o testemunho mais forte contra a narrativa consagrada, porque parte de um sócio da mesma academia, publicado enquanto os dois estavam vivos, e nunca respondido com documento.", "g": "Datas de nascimento e morte, trajetória posterior a São Paulo, e a existência ou não da certificação que ele dizia ter recebido."}, "kodokan": {"n": "Kodokan", "m": "", "v": "A instituição-mãe. Toda linhagem que esta obra rastreia, japonesa ou brasileira, remonta a este único ponto de origem institucional.", "o": "Esta obra rebaixou o próprio selo de fundação desta entidade de Documentado para Atestado ao perceber que citava a data sem apontar o registro fundacional — ver protocolo editorial, seção de tratamento de conflito. O fato é consenso universal; o documento que o funda, esta obra ainda não viu.", "g": "Registro fundacional primário. Relação institucional exata entre a fundação e o início da missão de difusão internacional."}, "kimura": {"n": "Masahiko Kimura", "m": "", "v": "O nome que batiza até hoje uma das chaves mais usadas do jiu-jitsu mundial nasce de uma derrota, não de uma vitória do lado brasileiro — e é exatamente essa derrota que a família transformou no maior ativo de imagem de sua história.", "o": "O resultado técnico foi dele, mas o resultado histórico coube ao adversário: a recusa em desistir, mesmo debaixo de uma chave que comprometia o braço, é o episódio mais citado de toda a bibliografia de linhagem como prova do caráter da arte praticada pela família. A chave usada para vencer passou a levar o nome dele nos tatames brasileiros até hoje — homenagem rara de se prestar a quem se venceu.", "g": "Apesar de ser o combate mais citado de toda a historiografia consultada, nenhuma fonte usada por esta obra aponta o recorte de jornal original, com veículo e página. É a lacuna mais visível de todo o Livro IV."}};

      o:"Em 1951 desafiou a Academia Gracie e sua equipe venceu, pela superioridade em chaves de pé — parte do currículo então desprezada como inferior. Hélio Gracie admitiu à imprensa que bastava um Fadda para mostrar que o jiu-jitsu não era privilégio dos Gracie."},
    donato:{n:"Donato Pires",m:"dos Reis",d:"atuação 1928–1939",
      v:"Aluno de Jacyntho Ferro. Contratado em 1928 para treinar a polícia de Minas Gerais por dois anos, convidou Carlos Gracie como instrutor assistente. Dirigiu a primeira academia de jiu-jitsu do Brasil de que há registro. Em 1939 abriu academia em São Paulo, com George Gracie como assistente.",
      o:"Contestou publicamente, em O Globo, a versão de que Carlos teria sido aluno de Maeda."},
    carlos:{n:"Carlos Gracie",m:"1902 — 1994",d:"14 set. 1902 — 7 out. 1994",
      v:"Aluno de Jacyntho Ferro segundo a imprensa de 1921. A própria biografia escrita por sua filha registra que teve o primeiro treinamento formal sob Donato Pires dos Reis, voltado à defesa pessoal. Professor dos irmãos e arquiteto da dinastia.",
      o:"A alegação de discipulado direto de Maeda não é invenção do nada — é uma compressão, que apaga dois intermediários brasileiros e liga o nome ao Japão em linha reta. Numa época em que legitimidade se media por proximidade com mestres japoneses, encurtar a linhagem valia dinheiro."},
    equipes:{n:"Nova União · GFTeam",m:"Rio de Janeiro",d:"linhagem Fadda",
      v:"As duas equipes que levaram a linhagem não-Gracie à competição de alto nível. A influência de França segue visível nos grandes campeonatos e no MMA através delas.",
      g:"Cadeia de graduações entre Fadda e os fundadores das equipes ainda não montada nó a nó."},
    acad:{n:"Academia, 1930",m:"Marques de Abrantes",d:"inaugurada em 9 set. 1930",
      v:"Primeira academia de jiu-jitsu do Brasil de que há registro, na Rua Marques de Abrantes, 106, Rio. Direção de Donato Pires dos Reis; Carlos e George Gracie como professores. Oferecia também capoeira e boxe. Na demonstração de abertura, Carlos, com 59 kg, dominou Edgard Rocha, de 90 kg, em 160 segundos.",
      f:"Correio da Manhã, 9 set. 1930",
      o:"O nome na direção não era Gracie. Pouco depois viraria Academia Gracie."},
    camp:{n:"Campeões",m:"linhagem não-Gracie",d:"1990 —",
      v:"Jacaré, Shaolin Ribeiro, BJ Penn, Robson Moura e outros formados nas equipes descendentes de Fadda.",
      g:"Verbetes individuais e cadeia de graduação por levantar."},
    gracie:{n:"Dinastia Gracie",m:"2ª e 3ª gerações",d:"1930 —",
      v:"Hélio, George, Oswaldo e Gastão Jr. na segunda geração; Carlson, Rolls, Rickson, Royce e dezenas de outros na terceira, onde a linhagem explode em ramos rivais.",
      o:"Hélio nunca esteve na órbita de Belém nem de Maeda: aprendeu com os irmãos, já dentro da academia de 1930."}
  },

  nav:{method:"Method",tree:"Tree",chron:"Timeline",conf:"Conflicts",access:"Access"},

  hero:{eyebrow:"Reference work · living edition",
    h1:"The whole tree,<br>sources in hand",
    sub:"From the first record of the term in Japan to today's mats. Every link in this database carries its own grade of proof — and you see it before you believe it.",
    cta1:"Walk the tree",cta2:"Read the method"},
  method:{eyebrow:"01 · House rule",title:"Every claim wears a belt",
    lede:"Plenty of jiu-jitsu history is already published. What doesn't exist is a work where every sentence is tagged with the kind of proof behind it. This database <strong>does not arbitrate</strong> between competing versions: it grades both and sets them side by side. You decide.",
    cards:[
      ["Documented","A locatable, citable primary source: period newspaper with title, date and page; civil registry; contract; minutes. <span class='kbd'>Archive required.</span>"],
      ["Attested","Testimony from someone who lived it — interview, published memoir, statement by a contemporary — with no confirming document."],
      ["Traditional","A narrative enshrined by a family, lineage or academy, with no identified primary basis. <span class='kbd'>Repetition earns no promotion.</span>"],
      ["Speculative","A modern researcher's inference from indirect data. Always named."]]},
  tree:{eyebrow:"02 · The database",title:"The tree, link by link",

  nodes:{
    jp:{n:"Japan",m:"koryū · Kodokan 1882",d:"17th c. — 1882",
      v:"The term <em>jūjutsu</em> (柔術) is coined in the 17th century, during the Edo period, becoming an umbrella for grappling disciplines previously called kogusoku, kumiuchi, taijutsu, yawara and torite. In 1882 Jigoro Kano founds the Kodokan and reorganises that technical body as a pedagogical project.",
      g:"No source gives the first DATED attestation of the term. '17th century' is a ceiling of consensus, not a document. Check Edo-school densho in the Kodokan collection."},
    miyako:{n:"Sada Miyako",m:"Rio · 1908",d:"arrives 17 Dec 1908",
      v:"Lands in Rio aboard the <em>Benjamin</em> alongside M. Kakihara, both hired as instructors to Brazilian sailors. By 1909 Brazilians they had trained were themselves teaching other Brazilians in Bahia and the federal capital. He fought cross-style bouts in Rio theatres.",
      f:"Gazeta de Notícias, 17 Dec 1908, p. 4 · 27 Jun 1909, p. 8",
      o:"This precedes Maeda by six years. If the archive confirms it, jiu-jitsu's entry point into Brazil is 1908 — and the first national transmission is military and public, not familial and private."},
    satake:{n:"Soshihiro Satake",m:"Manaus",d:"active c. 1915–1925",
      v:"Japanese judoka who taught in Manaus, with recorded activity at the Atlético Rio Negro Clube. Teacher of Luiz França and Vinicius Ruas.",
      g:"Arrival and departure dates in Brazil not fixed."},
    maeda:{n:"Mitsuyo Maeda",m:"Conde Koma · Belém",d:"1878 — 1941",
      v:"A Kodokan apprentice from 1897, he left on a diffusion mission in 1904 with stops across the United States, Europe, Mexico, Cuba and Central America. He landed in Pará in 1914 and settled in Belém until his death in 1941. He travelled often for exhibitions, leaving classes to his graded students.",
      o:"In 1920 he promoted five Brazilians to the 'first stripe' — the only promotion of Brazilians by him that can be confirmed. Carlos Gracie is not on the list."},
    omori:{n:"Geo Omori",m:"São Paulo · 1925",d:"active from 1925",
      v:"Japanese judoka established in São Paulo. He faced Carlos and George Gracie in the ring, and stated publicly that Carlos had not been taught directly by Maeda.",
      o:"An opponent's testimony — real evidentiary weight, but with a stake in the dispute. The work records the bias."},
    franca:{n:"Luiz França",m:"1910 — 1982",d:"2 Jun 1910 — 1982",
      v:"Founder of the principal non-Gracie lineage. He taught military personnel and residents of Rio's North Zone communities, emphasising self-defence and charging most students nothing. He joined the Navy in 1932, serving in the Marine Corps.",
      o:"His role as a forerunner of the Marine Corps self-defence system was never recorded by the Navy's sporting administration — it survived as oral account from former students. That is the most economical explanation for the documentary vacuum.",
      g:"Birthplace disputed: Manaus or Alagoas. Civil registry not located."},
    ferro:{n:"Jacyntho Ferro",m:"† 1929",d:"died 1929",
      v:"Maeda's leading Brazilian student and instructor at the Belém academy whenever the master travelled. Promoted to 'first stripe' in 1920. Teacher of Donato Pires dos Reis and Carlos Gracie.",
      o:"Were it not for a handful of period newspaper articles, he would have vanished from the record entirely. He is the link the enshrined narrative erases."},
    outros:{n:"+4 graded",m:"1920",d:"promoted 1920",
      v:"Waldemar Lopes, Raphael Gomes, Guilherme DelaRocque and Dr. Matheus Pereira. Promoted by Maeda at the same ceremony as Ferro.",
      g:"None produced a lineage traceable to today. Their trajectories remain to be worked up from the Pará press."},
    fadda:{n:"Oswaldo Fadda",m:"1921 — 2005",d:"graded by França in 1942",
      v:"He received his instructor grade from Luiz França in 1942. He taught for free in squares and on beaches, often without mats, and used jiu-jitsu in work with disabled people, above all polio survivors. He opened his own suburban academy on 27 January 1950.",
      o:"In 1951 he challenged the Gracie Academy and his team won, on the strength of footlocks — a part of the curriculum then dismissed as inferior. Hélio Gracie conceded to the press that one Fadda was enough to show jiu-jitsu was no Gracie privilege."},
    donato:{n:"Donato Pires",m:"dos Reis",d:"active 1928–1939",
      v:"A student of Jacyntho Ferro. Contracted in 1928 to train the Minas Gerais police for two years, he invited Carlos Gracie as assistant instructor. He directed the first recorded jiu-jitsu academy in Brazil. In 1939 he opened an academy in São Paulo with George Gracie as assistant.",
      o:"He publicly disputed, in O Globo, the account that Carlos had been Maeda's student."},
    carlos:{n:"Carlos Gracie",m:"1902 — 1994",d:"14 Sep 1902 — 7 Oct 1994",
      v:"A student of Jacyntho Ferro according to the 1921 press. The biography written by his own daughter records that his first formal training came under Donato Pires dos Reis, oriented to self-defence. Teacher of his brothers and architect of the dynasty.",
      o:"The claim of direct discipleship under Maeda is not invented from nothing — it is a compression, erasing two Brazilian intermediaries and linking the name to Japan in a straight line. In an era when legitimacy was measured by proximity to Japanese masters, shortening the lineage was worth money."},
    equipes:{n:"Nova União · GFTeam",m:"Rio de Janeiro",d:"Fadda lineage",
      v:"The two teams that carried the non-Gracie lineage into elite competition. França's influence remains visible in major championships and in MMA through them.",
      g:"The chain of promotions between Fadda and the teams' founders is not yet built node by node."},
    acad:{n:"Academy, 1930",m:"Marques de Abrantes",d:"opened 9 Sep 1930",
      v:"The first recorded jiu-jitsu academy in Brazil, at 106 Rua Marques de Abrantes, Rio. Directed by Donato Pires dos Reis, with Carlos and George Gracie as instructors. It also offered capoeira and boxing. At the opening demonstration Carlos, at 59 kg, dominated the 90 kg Edgard Rocha in 160 seconds.",
      f:"Correio da Manhã, 9 Sep 1930",
      o:"The name on the door was not Gracie. It would shortly become the Gracie Academy."},
    camp:{n:"Champions",m:"non-Gracie lineage",d:"1990 —",
      v:"Jacaré, Shaolin Ribeiro, BJ Penn, Robson Moura and others formed in the teams descended from Fadda.",
      g:"Individual entries and promotion chains still to be compiled."},
    gracie:{n:"Gracie dynasty",m:"2nd and 3rd generations",d:"1930 —",
      v:"Hélio, George, Oswaldo and Gastão Jr. in the second generation; Carlson, Rolls, Rickson, Royce and dozens more in the third, where the lineage bursts into rival branches.",
      o:"Hélio was never in the orbit of Belém or of Maeda: he learned from his brothers, inside the 1930 academy."}
  },

  nodes:{
    jp:{n:"Japón",m:"koryū · Kodokan 1882",d:"s. XVII — 1882",
      v:"El término <em>jūjutsu</em> (柔術) se acuña en el siglo XVII, en el período Edo, y pasa a ser paraguas de disciplinas de agarre antes llamadas kogusoku, kumiuchi, taijutsu, yawara y torite. En 1882 Jigoro Kano funda el Kodokan y reorganiza ese cuerpo técnico como proyecto pedagógico.",
      g:"Ninguna fuente señala la primera atestación FECHADA del término. 'Siglo XVII' es techo de consenso, no documento. Revisar densho de escuelas Edo en el acervo del Kodokan."},
    miyako:{n:"Sada Miyako",m:"Río · 1908",d:"llega el 17 dic. 1908",
      v:"Desembarca en Río a bordo del <em>Benjamin</em> junto a M. Kakihara, contratados como instructores de los marineros brasileños. En 1909 ya había brasileños formados por ellos enseñando a otros brasileños en Bahía y en la capital federal. Protagonizó combates entre modalidades distintas en teatros cariocas.",
      f:"Gazeta de Notícias, 17 dic. 1908, p. 4 · 27 jun. 1909, p. 8",
      o:"Antecede a Maeda en seis años. Si el archivo lo confirma, la entrada del jiu-jitsu en Brasil es 1908 — y la primera transmisión nacional es militar y pública, no familiar y privada."},
    satake:{n:"Soshihiro Satake",m:"Manaos",d:"activo c. 1915–1925",
      v:"Judoca japonés que enseñó en Manaos, con actividad registrada en el Atlético Rio Negro Clube. Maestro de Luiz França y de Vinicius Ruas.",
      g:"Fechas de llegada y salida de Brasil sin fijar."},
    maeda:{n:"Mitsuyo Maeda",m:"Conde Koma · Belém",d:"1878 — 1941",
      v:"Aprendiz del Kodokan desde 1897, parte en misión de difusión en 1904 con escalas por Estados Unidos, Europa, México, Cuba y Centroamérica. Desembarca en Pará en 1914 y se establece en Belém hasta morir, en 1941. Viajaba con frecuencia para exhibiciones, dejando las clases a alumnos graduados.",
      o:"En 1920 promovió a cinco brasileños al 'primer galón' — la única graduación de brasileños por él que puede confirmarse. Carlos Gracie no está en la lista."},
    omori:{n:"Geo Omori",m:"São Paulo · 1925",d:"activo desde 1925",
      v:"Judoca japonés establecido en São Paulo. Enfrentó a Carlos y George Gracie en el ring y declaró públicamente que Carlos no había sido instruido directamente por Maeda.",
      o:"Testimonio de adversario — peso probatorio real, pero con interés en la disputa. La obra registra el sesgo."},
    franca:{n:"Luiz França",m:"1910 — 1982",d:"2 jun. 1910 — 1982",
      v:"Fundador del principal linaje no-Gracie. Enseñó a militares y a vecinos de las comunidades de la Zona Norte carioca, con énfasis en defensa personal y sin cobrar a la mayoría. Ingresó en la Marina en 1932, sirviendo como Infante de Marina.",
      o:"Su papel como precursor del sistema de defensa personal del Cuerpo de Infantería de Marina nunca se registró en la administración deportiva de la Marina — sobrevivió como relato oral de antiguos alumnos. Es la explicación más económica del vacío documental.",
      g:"Lugar de nacimiento en disputa: Manaos o Alagoas. Registro civil no localizado."},
    ferro:{n:"Jacyntho Ferro",m:"† 1929",d:"muere en 1929",
      v:"Principal alumno brasileño de Maeda e instructor de la academia de Belém cuando el maestro viajaba. Promovido al 'primer galón' en 1920. Maestro de Donato Pires dos Reis y de Carlos Gracie.",
      o:"De no ser por unos pocos artículos de prensa de la época, se habría perdido por completo de la historia. Es el eslabón que la narrativa consagrada borra."},
    outros:{n:"+4 graduados",m:"1920",d:"promovidos en 1920",
      v:"Waldemar Lopes, Raphael Gomes, Guilherme DelaRocque y el Dr. Matheus Pereira. Promovidos por Maeda en la misma ceremonia que Ferro.",
      g:"Ninguno generó linaje rastreable hasta hoy. Trayectorias por levantar en la prensa paraense."},
    fadda:{n:"Oswaldo Fadda",m:"1921 — 2005",d:"graduado por França en 1942",
      v:"Recibió el grado de instructor de manos de Luiz França en 1942. Enseñó gratis en plazas y playas, muchas veces sin tatami, y usó el jiu-jitsu en la atención a personas con discapacidad, sobre todo víctimas de poliomielitis. Abrió academia propia en el suburbio el 27 de enero de 1950.",
      o:"En 1951 desafió a la Academia Gracie y su equipo venció, por superioridad en llaves de pie — parte del currículo entonces despreciada como inferior. Hélio Gracie admitió a la prensa que bastaba un Fadda para mostrar que el jiu-jitsu no era privilegio de los Gracie."},

/* ============================================================
   ESTADO E RENDER
   ============================================================ */
const SUPPORTED = ["pt","en","es"];
function pickLang(){
  const q = new URLSearchParams(location.search).get("lang");
  if (SUPPORTED.includes(q)) return q;
  const nav = (navigator.language || "en").slice(0,2).toLowerCase();
  return SUPPORTED.includes(nav) ? nav : "en";
}
let lang = pickLang();
const L = () => I18N[lang];

const sealHTML = (s, sm) =>
  `<span class="seal ${sm?"seal--sm":""}"><span class="seal__bar">${"<i></i>".repeat(SEAL[s])}</span><span class="seal__txt">${L().seals[s]}</span></span>`;

/* ---- construção única do DOM (posições e arestas vêm da base compilada) ---- */
const tree = document.getElementById("tree");
const svg  = document.getElementById("treeSvg");
const NODE_META = Object.fromEntries(TREE_NODES.map(n => [n.id, n]));

const [, , TREE_W, TREE_H] = TREE_VIEWBOX.split(" ").map(Number);
svg.setAttribute("viewBox", TREE_VIEWBOX);
tree.style.aspectRatio = `${TREE_W} / ${TREE_H}`;

EDGES.forEach(([a,b,s])=>{
  const A=POS[a], B=POS[b];
  if(!A || !B) return;  // aresta cujo nó ainda não está na árvore compilada
  const my=(A[1]+B[1])/2;
  const p=document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d",`M${A[0]},${A[1]+26} C${A[0]},${my} ${B[0]},${my} ${B[0]},${B[1]-26}`);
  p.setAttribute("class","link"+(s==="TRA"||s==="ESP"?" link--claim":""));
  svg.appendChild(p);
});

const nodeEls={};
ORDER.forEach(id=>{
  const meta = NODE_META[id];
  const el=document.createElement("button");
  el.type="button";
  el.className="node"+(meta.root ? " node--root" : "");
  el.style.left=(POS[id][0]/TREE_W*100)+"%";
  el.style.top =(POS[id][1]/TREE_H*100)+"%";
  el.innerHTML=`<span class="node__n">${meta.n}</span><span class="node__m">${meta.m||""}</span>`;
  el.addEventListener("click",()=>openDrawer(id,el));
  tree.appendChild(el);
  nodeEls[id]=el;
});

const sealCards=document.getElementById("sealCards");
["DOC","ATE","TRA","ESP"].forEach(k=>{
  const a=document.createElement("article");
  a.className="seals__c reveal";
  a.innerHTML=`<span class="seal"><span class="seal__bar">${"<i></i>".repeat(SEAL[k])}</span></span><h3></h3><p></p>`;
  sealCards.appendChild(a);
});

const chronEl=document.getElementById("chron");
CHRON_SEALS.forEach(s=>{
  const d=document.createElement("div");
  d.className="chron__r reveal";
  d.innerHTML=`<div class="chron__y"></div><p class="chron__t"></p><div class="chron__s">${sealHTML(s)}</div>`;
  chronEl.appendChild(d);
});

const ledEl=document.getElementById("led");
CONF_IDS.forEach(id=>{
  const d=document.createElement("div");
  d.className="led__r reveal";
  d.innerHTML=`<div><span class="led__id">${id}</span></div>
    <div><h3 class="led__o"></h3><p class="led__v vA"><em></em><span></span></p></div>
    <div><p class="led__v vB"><em></em><span></span></p><p class="led__v vT" style="margin-top:12px"><em></em><span></span></p></div>`;
  ledEl.appendChild(d);
});

const offerList=document.getElementById("offerList");
for(let i=0;i<5;i++) offerList.appendChild(document.createElement("li"));

const hseals=document.getElementById("hseals");
["DOC","ATE","TRA","ESP"].forEach(k=>{
  const s=document.createElement("span");
  s.className="seal";
  s.innerHTML=`<span class="seal__bar">${"<i></i>".repeat(SEAL[k])}</span><span class="seal__txt" data-seal="${k}"></span>`;
  hseals.appendChild(s);
});

/* ---- fallback de idioma: se en/es não tiver o verbete, usa o português
   e sinaliza "pending" — nunca quebra, nunca mente sobre o que existe ---- */
function nodeText(id){
  const ptV = TREE_VERBETES_PT[id] || {};
  const t = L();
  const trV = (t.nodes && t.nodes[id]) || {};
  return {
    n: trV.n ?? ptV.n ?? id,
    m: trV.m ?? ptV.m ?? "",
    v: trV.v ?? ptV.v ?? "",
    o: trV.o ?? ptV.o,
    g: trV.g ?? ptV.g,
    f: trV.f,
    d: trV.d ?? "",
    pending: lang !== "pt" && trV.v === undefined
  };
}

/* ---- aplicar idioma ---- */
function get(path){ return path.split(".").reduce((o,k)=>o&&o[k], L()); }

function applyLang(){
  const t=L();
  document.documentElement.lang=t.htmlLang;

  document.querySelectorAll("[data-t]").forEach(el=>{ el.innerHTML = get(el.dataset.t) ?? ""; });
  document.querySelectorAll("[data-seal]").forEach(el=>{ el.textContent = t.seals[el.dataset.seal]; });

  // cards de método
  sealCards.querySelectorAll(".seals__c").forEach((c,i)=>{
    c.querySelector("h3").textContent = t.method.cards[i][0];
    c.querySelector("p").innerHTML    = t.method.cards[i][1];
  });

  // nós da árvore — cada um com fallback próprio para português
  ORDER.forEach(id=>{
    const nt = nodeText(id);
    nodeEls[id].querySelector(".node__n").textContent = nt.n;
    nodeEls[id].querySelector(".node__m").textContent = nt.m;
    nodeEls[id].classList.toggle("is-pending", nt.pending);
  });

  // estatísticas reais da base, lidas de BASE_COUNTS — nunca digitadas à mão
  const STATS_LABELS_ALL = {
    pt:["pessoas e entidades","vínculos selados","fontes primárias","conflitos abertos"],
    en:["people and entities","sealed links","primary sources","open conflicts"],
    es:["personas y entidades","vínculos sellados","fuentes primarias","conflictos abiertos"]
  };
  const STATS_LABELS = STATS_LABELS_ALL[lang] || STATS_LABELS_ALL.pt;
  const bc = BASE_COUNTS;
  document.getElementById("baseStats").innerHTML = [
    [bc.pessoas + bc.entidades, STATS_LABELS[0]],
    [bc.vinculos, STATS_LABELS[1]],
    [bc.fontes, STATS_LABELS[2]],
    [bc.conflitos, STATS_LABELS[3]],
  ].map(([n,l])=>`<span><b style="color:var(--gold)">${n}</b>&nbsp;${l}</span>`).join("");

  // cronologia
  chronEl.querySelectorAll(".chron__r").forEach((r,i)=>{
    r.querySelector(".chron__y").textContent = t.chronRows[i][0];
    r.querySelector(".chron__t").innerHTML   = t.chronRows[i][1];
    r.querySelector(".seal__txt").textContent = t.seals[CHRON_SEALS[i]];
  });

  // conflitos
  ledEl.querySelectorAll(".led__r").forEach((r,i)=>{
    const row=t.confRows[i];
    r.querySelector(".led__o").textContent=row[0];
    r.querySelector(".vA em").textContent=t.conf.vA;   r.querySelector(".vA span").textContent=row[1];
    r.querySelector(".vB em").textContent=t.conf.vB;   r.querySelector(".vB span").textContent=row[2];
    r.querySelector(".vT em").textContent=t.conf.test; r.querySelector(".vT span").textContent=row[3];
  });

  // oferta
  offerList.querySelectorAll("li").forEach((li,i)=>{ li.textContent=t.offer.list[i]; });

  // seletor
  document.querySelectorAll("#lang button").forEach(b=>{
    b.setAttribute("aria-current", b.dataset.lang===lang ? "true" : "false");
  });

  if(drawer.classList.contains("is-open") && currentNode) renderDrawer(currentNode);
}

/* ---- drawer ---- */
const drawer=document.getElementById("drawer");
const dBody=document.getElementById("drawerBody");
let lastFocus=null, currentNode=null;

function renderDrawer(id){
  const t=L(), n=nodeText(id);
  const parents=EDGES.filter(e=>e[1]===id).map(e=>`<dd>${nodeText(e[0]).n} ${sealHTML(e[2],true)}</dd>`).join("");
  const kids   =EDGES.filter(e=>e[0]===id).map(e=>`<dd>${nodeText(e[1]).n} ${sealHTML(e[2],true)}</dd>`).join("");
  dBody.innerHTML=`
    <h3>${n.n}</h3>
    <p class="dates">${n.d||""}</p>
    ${n.pending?`<p class="dates" style="color:var(--blood)">${t.drawer.pending}</p>`:""}
    <p style="font-size:16px;line-height:1.6">${n.v}</p>
    ${n.f?`<dl><dt>${t.drawer.source}</dt><dd style="font-family:var(--f-mono);font-size:13px;color:var(--gold)">${n.f}</dd></dl>`:""}
    ${n.o?`<dl><dt>${t.drawer.note}</dt><dd>${n.o}</dd></dl>`:""}
    ${parents?`<dl><dt>${t.drawer.from}</dt>${parents}</dl>`:""}
    ${kids?`<dl><dt>${t.drawer.to}</dt>${kids}</dl>`:""}
    ${n.g?`<dl><dt class="gap">${t.drawer.gap}</dt><dd>${n.g}</dd></dl>`:""}`;
}
function openDrawer(id, el){
  document.querySelectorAll(".node.is-sel").forEach(x=>x.classList.remove("is-sel"));
  el.classList.add("is-sel");
  lastFocus=el; currentNode=id;
  renderDrawer(id);
  drawer.classList.add("is-open");
  drawer.setAttribute("aria-hidden","false");
  document.getElementById("drawerX").focus();
}
function closeDrawer(){
  drawer.classList.remove("is-open");
  drawer.setAttribute("aria-hidden","true");
  currentNode=null;
  document.querySelectorAll(".node.is-sel").forEach(x=>x.classList.remove("is-sel"));
  if(lastFocus) lastFocus.focus();
}
document.getElementById("drawerX").addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });

/* ---- troca de idioma: sem storage, estado vive na URL ---- */
document.getElementById("lang").addEventListener("click",e=>{
  const b=e.target.closest("button[data-lang]");
  if(!b || b.dataset.lang===lang) return;
  lang=b.dataset.lang;
  const u=new URL(location.href);
  u.searchParams.set("lang",lang);
  history.replaceState({},"",u);
  applyLang();
});

applyLang();

/* ============================================================
   MOVIMENTO
   ============================================================ */
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

if(!reduce && window.gsap){
  gsap.registerPlugin(ScrollTrigger);

  gsap.timeline({defaults:{ease:"power3.out"}})
    .from("#emblem",{opacity:0,scale:.82,duration:1.15,ease:"power2.out"})
    .from("#eyebrow",{opacity:0,y:14,duration:.5},"-=.5")
    .from("#h1",{opacity:0,y:34,duration:.85},"-=.3")
    .from("#hsub",{opacity:0,y:20,duration:.7},"-=.55")
    .from("#hseals .seal",{opacity:0,y:16,stagger:.09,duration:.5},"-=.4")
    .from("#hcta .btn",{opacity:0,y:16,stagger:.08,duration:.5},"-=.35")
    .add(()=>document.getElementById("nav").classList.add("is-on"));

  gsap.utils.toArray(".reveal").forEach(el=>{
    gsap.fromTo(el,{opacity:0,y:26},{opacity:1,y:0,duration:.75,ease:"power2.out",
      scrollTrigger:{trigger:el,start:"top 86%"}});
  });

  gsap.utils.toArray("#treeSvg .link").forEach((p,i)=>{
    const len=p.getTotalLength();
    gsap.set(p,{strokeDasharray:len,strokeDashoffset:len});
    gsap.to(p,{strokeDashoffset:0,duration:1.1,ease:"power1.inOut",delay:i*.045,
      scrollTrigger:{trigger:"#arvore",start:"top 62%"}});
  });
  gsap.from(".node",{opacity:0,scale:.86,duration:.5,ease:"back.out(1.6)",
    stagger:{each:.045},scrollTrigger:{trigger:"#arvore",start:"top 62%"}});
} else {
  document.querySelectorAll(".reveal").forEach(e=>e.style.opacity=1);
  document.getElementById("nav").classList.add("is-on");
}
</script>
