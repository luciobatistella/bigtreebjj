<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>The Big Tree BJJ — Motion Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0805;
    --panel:rgba(22,18,9,0.86);
    --hairline:rgba(201,151,76,0.2);
    --gold:#c9974c; --gold-bright:#e8c078; --gold-dim:#8a6a34;
    --text:#f1e7d3; --muted:#9c9384; --faint:#6b6255;
    --c-high:#5f9c76; --c-medium:#c98f4c; --c-manual:#7b9ec9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;}
  body{font-family:'Inter',sans-serif;color:var(--text);}

  #scene{position:fixed;inset:0;display:block;cursor:grab;}
  #scene.dragging{cursor:grabbing;}

  /* ---------- topo ---------- */
  #topbar{
    position:fixed;top:0;left:0;right:0;z-index:30;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:12px 20px;
    background:linear-gradient(to bottom, rgba(10,8,5,0.92), rgba(10,8,5,0));
    pointer-events:none;
  }
  #topbar > *{pointer-events:auto;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:600;color:var(--gold-bright);font-size:13px;
    box-shadow:0 0 18px rgba(201,151,76,0.25);
  }
  .brand-text{line-height:1.05;}
  .brand-text b{font-family:'Fraunces',serif;font-size:16px;letter-spacing:0.5px;color:var(--gold-bright);}
  .brand-text small{display:block;font-size:9px;letter-spacing:2.4px;color:var(--muted);text-transform:uppercase;}
  .tools{display:flex;gap:10px;align-items:center;}
  select,#search{
    background:var(--panel);border:1px solid var(--hairline);color:var(--text);
    border-radius:9px;padding:9px 12px;font-size:12.5px;font-family:'Inter',sans-serif;outline:none;
    backdrop-filter:blur(6px);
  }
  select{max-width:240px;cursor:pointer;}
  #search{width:250px;}
  select:focus,#search:focus{border-color:var(--gold-dim);}
  .search-wrap{position:relative;}
  #search-results{
    position:absolute;top:calc(100% + 6px);right:0;width:290px;
    background:var(--panel);border:1px solid var(--hairline);border-radius:10px;
    max-height:300px;overflow-y:auto;display:none;backdrop-filter:blur(10px);
  }
  #search-results.show{display:block;}
  #search-results .item{padding:9px 13px;font-size:12.5px;cursor:pointer;}
  #search-results .item:hover{background:rgba(201,151,76,0.12);}
  #search-results .item small{display:block;color:var(--faint);font-size:10.5px;margin-top:1px;}

  /* ---------- card de detalhe ---------- */
  #detail{
    position:fixed;top:74px;right:18px;width:300px;z-index:25;
    background:var(--panel);border:1px solid var(--hairline);border-radius:16px;
    padding:20px;backdrop-filter:blur(12px);
    transform:translateX(340px);opacity:0;
    transition:transform .55s cubic-bezier(.2,1.1,.3,1), opacity .35s ease;
    max-height:calc(100vh - 160px);overflow-y:auto;
  }
  #detail.show{transform:translateX(0);opacity:1;}
  #detail .close{
    position:absolute;top:10px;right:12px;background:none;border:none;color:var(--faint);
    font-size:17px;cursor:pointer;padding:4px;
  }
  #detail .close:hover{color:var(--gold-bright);}
  .d-avatar{
    width:70px;height:70px;border-radius:50%;margin:0 auto 10px;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%, #2c2313, #14100a);
    border:2px solid var(--gold-dim);
    font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--gold-bright);
    box-shadow:0 0 26px rgba(201,151,76,0.22);
  }
  .d-name{font-family:'Fraunces',serif;font-size:18px;font-weight:600;text-align:center;margin:0;}
  .d-nick{text-align:center;color:var(--gold);font-size:11.5px;font-style:italic;margin:3px 0 4px;}
  .d-team{text-align:center;font-size:12px;color:var(--muted);margin:0 0 12px;}
  .d-label{font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint);margin:14px 0 7px;
    border-top:1px solid var(--hairline);padding-top:12px;}
  .chain{list-style:none;margin:0;padding:0;}
  .chain li{position:relative;padding:4px 0 4px 20px;font-size:12px;color:var(--muted);cursor:pointer;}
  .chain li:hover{color:var(--gold-bright);}
  .chain li.cur{color:var(--gold-bright);font-weight:500;cursor:default;}
  .chain li::before{content:'';position:absolute;left:4px;top:10px;width:6px;height:6px;border-radius:50%;background:var(--gold-dim);}
  .chain li.cur::before{background:var(--gold-bright);box-shadow:0 0 8px var(--gold-bright);}
  .chain li:not(:last-child)::after{content:'';position:absolute;left:6.5px;top:17px;width:1px;height:calc(100% - 6px);background:var(--hairline);}
  .d-bio{font-size:12px;line-height:1.55;color:var(--text);}
  .evbox{background:rgba(201,151,76,0.07);border-left:2px solid var(--gold-dim);
    padding:7px 10px;font-size:11px;line-height:1.5;color:var(--muted);font-style:italic;margin-top:7px;border-radius:0 4px 4px 0;}
  .pill{display:inline-block;font-size:9.5px;letter-spacing:0.8px;text-transform:uppercase;
    padding:3px 9px;border-radius:11px;border:1px solid;margin-top:5px;}
  .pill.high{color:var(--c-high);border-color:rgba(95,156,118,0.45);}
  .pill.medium{color:var(--c-medium);border-color:rgba(201,143,76,0.45);}
  .pill.manual{color:var(--c-manual);border-color:rgba(123,158,201,0.45);}
  .pill.root{color:var(--faint);border-color:var(--hairline);}
  #story-btn{
    width:100%;margin-top:14px;padding:11px;border-radius:10px;cursor:pointer;
    background:linear-gradient(135deg, rgba(201,151,76,0.22), rgba(201,151,76,0.08));
    border:1px solid var(--gold-dim);color:var(--gold-bright);
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:0.4px;
    transition:box-shadow .25s ease, transform .15s ease;
  }
  #story-btn:hover{box-shadow:0 0 22px rgba(201,151,76,0.35);transform:translateY(-1px);}
  .src{display:inline-block;margin-top:10px;font-size:11px;color:var(--gold);text-decoration:none;}
  .src:hover{color:var(--gold-bright);text-decoration:underline;}

  /* ---------- tooltip hover ---------- */
  #tip{
    position:fixed;z-index:28;pointer-events:none;
    background:var(--panel);border:1px solid var(--hairline);border-radius:10px;
    padding:9px 12px;font-size:12px;backdrop-filter:blur(8px);
    opacity:0;transform:translateY(6px);transition:opacity .18s ease, transform .18s ease;
    max-width:220px;
  }
  #tip.show{opacity:1;transform:translateY(0);}
  #tip b{font-family:'Fraunces',serif;font-weight:600;font-size:13px;display:block;}
  #tip span{color:var(--faint);font-size:10.5px;}

  /* ---------- legenda ---------- */
  #legend{
    position:fixed;left:18px;bottom:18px;z-index:24;
    background:var(--panel);border:1px solid var(--hairline);border-radius:12px;
    padding:11px 14px;font-size:11px;color:var(--muted);backdrop-filter:blur(8px);
  }
  #legend .row{display:flex;align-items:center;gap:8px;margin-top:5px;}
  #legend .row:first-child{margin-top:0;}
  .lg{width:16px;height:0;border-top:2px solid;flex-shrink:0;}
  .lg.high{border-color:var(--c-high);}
  .lg.medium{border-color:var(--c-medium);border-style:dashed;}
  .lg.manual{border-color:var(--c-manual);border-style:dashed;}
  #hint{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:24;
    font-size:11px;color:var(--faint);letter-spacing:0.3px;
    background:var(--panel);border:1px solid var(--hairline);border-radius:20px;
    padding:7px 16px;backdrop-filter:blur(8px);
    transition:opacity .5s ease;
  }

  /* ---------- modo história (cinema) ---------- */
  .bar{position:fixed;left:0;right:0;height:0;background:#000;z-index:40;transition:height .7s cubic-bezier(.6,0,.3,1);}
  #bar-top{top:0;}
  #bar-bot{bottom:0;}
  body.cinema #bar-top,body.cinema #bar-bot{height:9vh;}
  #caption{
    position:fixed;bottom:calc(9vh + 22px);left:50%;transform:translateX(-50%) translateY(20px);
    z-index:41;text-align:center;opacity:0;transition:opacity .5s ease, transform .5s ease;
    pointer-events:none;
  }
  body.cinema #caption{opacity:1;transform:translateX(-50%) translateY(0);}
  #caption b{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--gold-bright);
    text-shadow:0 0 30px rgba(201,151,76,0.5);display:block;}
  #caption span{font-size:12.5px;color:var(--muted);letter-spacing:0.5px;}
  #caption small{display:block;font-size:10px;letter-spacing:2.5px;color:var(--faint);text-transform:uppercase;margin-bottom:6px;}
  #story-exit{
    position:fixed;top:calc(9vh + 14px);right:20px;z-index:42;
    background:var(--panel);border:1px solid var(--hairline);border-radius:20px;
    color:var(--muted);font-size:11.5px;padding:7px 15px;cursor:pointer;
    opacity:0;pointer-events:none;transition:opacity .4s ease;
  }
  body.cinema #story-exit{opacity:1;pointer-events:auto;}
  #story-exit:hover{color:var(--gold-bright);border-color:var(--gold-dim);}
  body.cinema #topbar, body.cinema #detail, body.cinema #legend, body.cinema #hint{opacity:0;pointer-events:none;}
  #topbar,#detail,#legend{transition:opacity .4s ease;}
</style>
</head>

<canvas id="scene"></canvas>

<div id="topbar">
  <div class="brand">
    <div class="brand-mark">BT</div>
    <div class="brand-text"><b>THE BIG TREE</b><small>Motion Prototype</small></div>
  </div>
  <div class="tools">
    <select id="tree-select"></select>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="Buscar lutador..." autocomplete="off">

</div>

<div id="detail">

  <div id="detail-body"></div>
</div>

<div id="tip"></div>

<div id="legend">

<div id="caption"><small>Linhagem</small><b id="cap-name"></b><span id="cap-sub"></span></div>
<button id="story-exit">✕ sair do modo história</button>

:"rian grappler and a black belt in jiu-jitsu under Rômulo Barral, who worked extensively with other instructors such as Max"}]},{"id":"5000","name":"Givanildo Santana","nickname":"Giva, The Arm Collector","team":"Lotus","url":"https://www.bjjheroes.com/?p=5000","bio":"Givanildo Santana, often called “Giva” Santana or even “The Arm Collector”, is aBrazilian jiu jitsublack belt under the illustriousMoises Muradi, who is regarded as one of the toughest grapplers of his generation,…","confidence":"root","source":"root","evidence":"","children":[{"id":"9370","name":"Fabricio Medici","nickname":"","team":"Kioto","url":"https://www.bjjheroes.com/?p=9370","bio":"Fabricio Medici is aBrazilian Jiu-Jitsublack belt underGivanildo Santana, having also worked extensively withMaster Francisco Mansur, being a member of the prestigious Kioto gym, one of BJJ’s most traditional academies.…","confidence":"high","source":"bio_extraction","evidence":"Brazilian Jiu-Jitsublack belt under Givanildo Santana, having also worked extensively with Master Francisco Mansu"},{"id":"1041","name":"Laercio Fernandes","nickname":"","team":"Team Oyama","url":"https://www.bjjheroes.com/?p=1041","bio":"Laercio Fernandes is one of the topjiu jitsucompetitors in thePluma weight division(under 64kg/141lbs). A black belt under Givanildo Santana, this fighter from the state of Sao Paulo raised a few eyebrows in 2010 after…","confidence":"high","source":"bio_extraction","evidence":"der 64kg/141lbs). A black belt under Givanildo Santana, this fighter from the state of Sao Paulo raised a few eyeb"},{"id":"10357","name":"Richard Alarcon","nickname":"Red","team":"","url":"https://www.bjjheroes.com/?p=10357","bio":"Richard Alarcon, also known as “Red”, is aBrazilian jiu-jitsublack belt underGivanildo Santanaof the One Jiu-Jitsu Academy, who also worked extensively with Matt Salinas (10th Planet Orange County). Better known for his…","confidence":"high","source":"bio_extraction","evidence":"Brazilian jiu-jitsublack belt under Givanildo Santanaof the One Jiu-Jitsu Academy, who also worked extensively with Matt Sa"}]}];
'use strict';

/* ============ dados / árvore lógica ============ */
let TREE = null;              // raiz lógica atual (com _children p/ colapso)
let layoutDirty = true;
const NODE_R = 21, LEVEL_H = 158, SLOT_W = 116;

function cloneTree(src, depth=0, collapseAt=3){
  const n = {
    id:String(src.id), name:src.name, nickname:src.nickname||'', team:src.team||'',
    url:src.url||'', bio:src.bio||'', photo:src.photo||'',
    confidence:src.confidence||'root', source:src.source||'root', evidence:src.evidence||'',
    children:null, _children:null, parent:null,
    x:0, y:0, sx:0, sy:0,     // alvo do layout e posição suavizada
    birth:0, alpha:1,
  };
  const kids = (src.children||[]).map(c=>cloneTree(c, depth+1, collapseAt));
  kids.forEach(k=>k.parent=n);
  if(kids.length){
    if(depth>=collapseAt){ n._children=kids; }
    else n.children=kids;
  }
  return n;
}
function visit(n, fn){ fn(n); (n.children||[]).forEach(c=>visit(c,fn)); }
function visitAll(n, fn){ fn(n); (n.children||n._children||[]).forEach(c=>visitAll(c,fn)); }
function countAll(n){ return (n.children||n._children||[]).reduce((s,c)=>s+1+countAll(c),0); }
function treeSizeRaw(s){ return 1+(s.children||[]).reduce((a,c)=>a+treeSizeRaw(c),0); }

/* layout tidy vertical */
function layout(){
  let cursor = 0;
  (function place(n, depth){
    n.y = depth*LEVEL_H;
    const kids = n.children||[];
    if(!kids.length){ n.x = cursor; cursor += SLOT_W; return; }
    kids.forEach(k=>place(k, depth+1));
    n.x = (kids[0].x + kids[kids.length-1].x)/2;
  })(TREE, 0);
  const off = TREE.x;
  visit(TREE, n=>{ n.x -= off; });
  layoutDirty = false;
}

/* ============ canvas / câmera ============ */
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
let W=0, H=0, DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  makeVignette();
}
window.addEventListener('resize', resize);

const cam = { x:0, y:220, k:0.85, tx:0, ty:220, tk:0.85 };
function camFlyTo(x, y, k){ cam.tx=x; cam.ty=y; if(k) cam.tk=k; }
function worldToScreen(x,y){ return [ (x-cam.x)*cam.k + W/2, (y-cam.y)*cam.k + H/2 ]; }
function screenToWorld(px,py){ return [ (px-W/2)/cam.k + cam.x, (py-H/2)/cam.k + cam.y ]; }

/* pan/zoom */
let dragging=false, dragMoved=false, lx=0, ly=0;
cv.addEventListener('mousedown', e=>{ dragging=true; dragMoved=false; lx=e.clientX; ly=e.clientY; cv.classList.add('dragging'); });
window.addEventListener('mousemove', e=>{
  if(dragging){
    const dx=e.clientX-lx, dy=e.clientY-ly;
    if(Math.abs(dx)+Math.abs(dy)>3) dragMoved=true;
    cam.x -= dx/cam.k; cam.y -= dy/cam.k;
    cam.tx = cam.x; cam.ty = cam.y;
    lx=e.clientX; ly=e.clientY;
  } else {
    hover(e.clientX, e.clientY);
  }
});
window.addEventListener('mouseup', ()=>{ dragging=false; cv.classList.remove('dragging'); });
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const f = e.deltaY<0 ? 1.12 : 0.89;
  const [wx,wy] = screenToWorld(e.clientX, e.clientY);
  const nk = Math.min(2.4, Math.max(0.16, cam.tk*f));
  /* zoom em direção ao cursor */
  cam.tx = wx - (e.clientX - W/2)/nk;
  cam.ty = wy - (e.clientY - H/2)/nk;
  cam.tk = nk;
}, {passive:false});

/* ============ efeitos: sprites de glow, brasas ============ */
function glowSprite(r, color){
  const c = document.createElement('canvas');
  c.width = c.height = r*2;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(r,r,0,r,r,r);
  grad.addColorStop(0, color);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0,0,r*2,r*2);
  return c;
}
const SP_GOLD  = glowSprite(32, 'rgba(232,192,120,0.9)');
const SP_EMBER = glowSprite(16, 'rgba(224,150,70,0.8)');
const SP_HALO  = glowSprite(90, 'rgba(201,151,76,0.55)');

let vignette=null;
function makeVignette(){
  vignette = document.createElement('canvas');
  vignette.width=W; vignette.height=H;
  const g = vignette.getContext('2d');
  const grad = g.createRadialGradient(W/2, H*0.38, Math.min(W,H)*0.25, W/2, H/2, Math.max(W,H)*0.75);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle=grad; g.fillRect(0,0,W,H);
}

const embers = Array.from({length:54}, ()=>({
  x:Math.random(), y:Math.random(), s:0.5+Math.random()*1.4,
  vy:0.006+Math.random()*0.02, ph:Math.random()*Math.PI*2, drift:(Math.random()-0.5)*0.008,
}));

/* pulsos viajando nos links */
const pulses = []; // {link:[a,b], t, speed, boost}
function seedPulses(){
  pulses.length = 0;
  visit(TREE, n=>{
    (n.children||[]).forEach(c=>{
      pulses.push({a:n, b:c, t:Math.random(), speed:0.0022+Math.random()*0.002, boost:false});
    });
  });
}

/* ============ seleção / trace de linhagem ============ */
let selected=null, path=[], pathSet=new Set(), revealT0=0;
function ancestors(n){ const a=[]; let c=n; while(c){ a.unshift(c); c=c.parent; } return a; }

function select(n, opts){
  opts = opts||{};
  selected = n;
  /* expande 1 geração no select — espetáculo */
  if(n._children && !opts.noExpand){
    n.children = n._children; n._children = null;
    const t = performance.now();
    n.children.forEach((k,i)=>{ visitAll(k, d=>{ d.birth = t + i*70; }); k.birth = t + i*70; });
    layoutDirty = true;
    seedPulses();
  }
  path = ancestors(n);
  pathSet = new Set(path.map(p=>p.id));
  revealT0 = performance.now();
  renderDetail(n);
  if(!opts.noCam){
    camFlyTo(n.x, n.y - LEVEL_H*0.4, Math.max(cam.tk, 0.8));
  }
}
function clearSelection(){
  selected=null; path=[]; pathSet.clear();
  document.getElementById('detail').classList.remove('show');
}

function toggleCollapse(n){
  if(n.children){
    n._children=n.children; n.children=null;
  } else if(n._children){
    n.children=n._children; n._children=null;
    const t=performance.now();
    n.children.forEach((k,i)=>{ k.birth=t+i*70; });
  }
  layoutDirty=true;
  seedPulses();
}

/* ============ hit test / hover / clique ============ */
function nodeAt(px,py){
  const [wx,wy]=screenToWorld(px,py);
  let best=null, bd=1e9;
  visit(TREE, n=>{
    const dx=n.sx-wx, dy=n.sy-wy, d=dx*dx+dy*dy;
    if(d < (NODE_R+16)*(NODE_R+16) && d<bd){ bd=d; best=n; }
  });
  return best;
}

const tip=document.getElementById('tip');
let hoverN=null;
function hover(px,py){
  const n=nodeAt(px,py);
  hoverN=n;
  if(n && n!==selected){
    tip.innerHTML=`<b>${n.name}</b>${n.nickname?`<span>"${n.nickname}" · </span>`:''}<span>${n.team||'—'}</span>`;
    tip.style.left=(px+16)+'px'; tip.style.top=(py+10)+'px';
    tip.classList.add('show');
    cv.style.cursor='pointer';
  } else {
    tip.classList.remove('show');
    if(!dragging) cv.style.cursor='grab';
  }
}
/* clique: badge de colapso (coord. de tela) > nó > vazio limpa seleção */
function badgeAtScreen(px,py){
  let hit=null;
  visit(TREE,n=>{
    if(!n._children || n._badgeY===undefined) return;
    const [sx]=worldToScreen(n.sx,n.sy);
    const dx=sx-px, dy=n._badgeY-py;
    if(dx*dx+dy*dy<13*13) hit=n;
  });
  return hit;
}
cv.addEventListener('click', e=>{
  if(dragMoved) return;
  const b=badgeAtScreen(e.clientX,e.clientY);
  if(b){ toggleCollapse(b); return; }
  const n=nodeAt(e.clientX,e.clientY);
  if(n) select(n);
  else if(!story.on) clearSelection();
});

/* ============ painel de detalhe ============ */
function initials(name){
  return name.split(/\s+/).filter(w=>w.length>1&&w[0]===w[0].toUpperCase())
    .slice(0,2).map(w=>w[0]).join('').toUpperCase()||name[0].toUpperCase();
}
function pillFor(n){
  if(n.source==='manual_curation') return ['manual','Curadoria histórica'];
  if(n.source==='manual_audit') return ['manual','Auditoria manual'];
  if(n.confidence==='high') return ['high','Extraída da bio · alta'];
  if(n.confidence==='medium') return ['medium','Extraída da bio · média'];
  return ['root','Raiz da linhagem'];
}
function renderDetail(n){
  const chain=ancestors(n);
  const [pc,pt]=pillFor(n);
  document.getElementById('detail-body').innerHTML=`
    <div class="d-avatar">${initials(n.name)}</div>
    <p class="d-name">${n.name}</p>
    ${n.nickname?`<p class="d-nick">"${n.nickname}"</p>`:''}
    ${n.team?`<p class="d-team">${n.team}</p>`:''}
    <div class="d-label">Linhagem</div>
    <ul class="chain">
      ${chain.map((c,i)=>`<li class="${i===chain.length-1?'cur':''}" data-id="${c.id}">${c.name}</li>`).join('')}
    </ul>
    ${n.parent?`<div class="d-label">Conexão</div><span class="pill ${pc}">${pt}</span>${n.evidence?`<div class="evbox">"${n.evidence}"</div>`:''}`:''}
    ${n.bio?`<div class="d-label">Sobre</div><div class="d-bio">${n.bio}</div>`:''}
    ${n.url?`<a class="src" href="${n.url}" target="_blank" rel="noopener">Ver fonte no BJJ Heroes ↗</a>`:''}
    <button id="story-btn">▶ &nbsp;Reproduzir história da linhagem</button>
  `;
  document.getElementById('detail').classList.add('show');
  document.querySelectorAll('.chain li:not(.cur)').forEach(li=>{
    li.addEventListener('click', ()=>{
      let f=null; visit(TREE,x=>{ if(x.id===li.dataset.id) f=x; });
      if(f) select(f);
    });
  });
  document.getElementById('story-btn').addEventListener('click', ()=>startStory(n));
}
document.getElementById('detail-close').addEventListener('click', clearSelection);

/* ============ modo história ============ */
let story={on:false, steps:[], idx:0, timer:null};
function startStory(n){
  story.steps=ancestors(n); story.idx=0; story.on=true;
  document.body.classList.add('cinema');
  select(story.steps[0], {noCam:true, noExpand:true});
  storyStep();
}
function storyStep(){
  if(!story.on) return;
  const s=story.steps[story.idx];
  select(s, {noExpand:true, noCam:true});
  camFlyTo(s.x, s.y, 1.05);
  document.getElementById('cap-name').textContent=s.name;
  document.getElementById('cap-sub').textContent=
    (s.nickname?`"${s.nickname}" · `:'')+(s.team||'')+
    `  ·  geração ${story.idx+1} de ${story.steps.length}`;
  story.idx++;
  if(story.idx<story.steps.length){
    story.timer=setTimeout(storyStep, 1900);
  } else {
    story.timer=setTimeout(stopStory, 2600);
  }
}
function stopStory(){
  story.on=false;
  clearTimeout(story.timer);
  document.body.classList.remove('cinema');
  if(story.steps.length){
    const last=story.steps[story.steps.length-1];
    select(last,{noExpand:true});
  }
}
document.getElementById('story-exit').addEventListener('click', stopStory);
window.addEventListener('keydown', e=>{ if(e.key==='Escape'&&story.on) stopStory(); });

/* ============ render ============ */
function edgeColor(child, lit){
  const s=child.source;
  if(lit) return 'rgba(232,192,120,';
  if(s==='manual_curation'||s==='manual_audit') return 'rgba(123,158,201,';
  if(child.confidence==='high') return 'rgba(95,156,118,';
  if(child.confidence==='medium') return 'rgba(201,143,76,';
  return 'rgba(138,106,52,';
}
function bezier(ax,ay,bx,by,t){
  const my=(ay+by)/2;
  const u=1-t;
  const x = u*u*u*ax + 3*u*u*t*ax + 3*u*t*t*bx + t*t*t*bx;
  const y = u*u*u*ay + 3*u*u*t*my + 3*u*t*t*my + t*t*t*by;
  return [x,y];
}
function pathReveal(child){
  /* 0..1: quanto do trace já chegou nesse elo */
  if(!pathSet.has(child.id) || !child.parent) return 0;
  const idx = path.indexOf(child);
  const t = (performance.now()-revealT0 - (idx-1)*230)/420;
  return Math.max(0, Math.min(1, t));
}

let fontsReady=false;
document.fonts.ready.then(()=>{ fontsReady=true; });

function frame(now){
  requestAnimationFrame(frame);
  if(layoutDirty) layout();

  /* câmera easing */
  cam.x += (cam.tx-cam.x)*0.085;
  cam.y += (cam.ty-cam.y)*0.085;
  cam.k += (cam.tk-cam.k)*0.085;

  /* posições suavizadas dos nós */
  visit(TREE, n=>{
    if(n.sx===0&&n.sy===0&&n.parent){ n.sx=n.parent.sx; n.sy=n.parent.sy; }
    n.sx += (n.x-n.sx)*0.12;
    n.sy += (n.y-n.sy)*0.12;
  });

  ctx.setTransform(DPR,0,0,DPR,0,0);
  /* fundo */
  ctx.fillStyle='#0a0805';
  ctx.fillRect(0,0,W,H);

  /* brasas (espaço de tela, atrás de tudo) */
  ctx.globalCompositeOperation='lighter';
  embers.forEach(p=>{
    p.y -= p.vy/60; p.x += p.drift/60; p.ph += 0.02;
    if(p.y<-0.02){ p.y=1.02; p.x=Math.random(); }
    const a=0.25+0.2*Math.sin(p.ph);
    ctx.globalAlpha=a;
    const s=p.s*8;
    ctx.drawImage(SP_EMBER, p.x*W-s/2, p.y*H-s/2, s, s);
  });
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';

  const dimmed = selected!==null;
  const t = now*0.001;

  /* ----- links ----- */
  visit(TREE, n=>{
    (n.children||[]).forEach(c=>{
      const [ax,ay]=worldToScreen(n.sx, n.sy+NODE_R);
      const [bx,by]=worldToScreen(c.sx, c.sy-NODE_R);
      const lit = pathSet.has(c.id) && pathSet.has(n.id);
      const rv = pathReveal(c);
      let alpha = dimmed && !lit ? 0.12 : 0.5;
      if(lit) alpha = 0.25 + rv*0.75;
      const col = edgeColor(c, lit&&rv>0);
      const my=(ay+by)/2;
      ctx.beginPath();
      ctx.moveTo(ax,ay);
      ctx.bezierCurveTo(ax,my,bx,my,bx,by);
      ctx.strokeStyle = col + alpha + ')';
      ctx.lineWidth = (lit ? 2.4 : 1.3)*Math.min(cam.k,1.2);
      if(!lit && (c.confidence==='medium'||c.source==='manual_curation'||c.source==='manual_audit')) ctx.setLineDash([6,5]);
      else ctx.setLineDash([]);
      ctx.stroke();
      ctx.setLineDash([]);
      if(lit && rv>0){
        /* glow do trace */
        ctx.globalCompositeOperation='lighter';
        ctx.globalAlpha = 0.35*rv;
        ctx.lineWidth = 6*Math.min(cam.k,1.2);
        ctx.strokeStyle='rgba(232,192,120,0.35)';
        ctx.stroke();
        ctx.globalAlpha=1;
        ctx.globalCompositeOperation='source-over';
      }
    });
  });

  /* ----- pulsos de energia ----- */
  ctx.globalCompositeOperation='lighter';
  pulses.forEach(p=>{
    if(!p.a.children || !p.a.children.includes(p.b)) return;
    const lit = pathSet.has(p.b.id)&&pathSet.has(p.a.id);
    p.t += p.speed * (lit?2.6:1);
    if(p.t>1) p.t=0;
    if(dimmed && !lit) return;
    const [ax,ay]=worldToScreen(p.a.sx,p.a.sy+NODE_R);
    const [bx,by]=worldToScreen(p.b.sx,p.b.sy-NODE_R);
    const [px,py]=bezier(ax,ay,bx,by,p.t);
    const s=(lit?22:11)*Math.min(cam.k,1.3);
    ctx.globalAlpha = lit?0.9:0.45;
    ctx.drawImage(SP_GOLD, px-s/2, py-s/2, s, s);
  });
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';

  /* ----- nós ----- */
  visit(TREE, n=>{
    const [sx,sy]=worldToScreen(n.sx,n.sy);
    if(sx<-80||sx>W+80||sy<-80||sy>H+80) return;
    const onPath = pathSet.has(n.id);
    const isSel = n===selected;
    const born = n.birth? Math.min(1,(now-n.birth)/450) : 1;
    if(born<=0) return;
    const pop = born<1 ? (1 - Math.pow(1-born,3))*(1+0.25*Math.sin(born*Math.PI)) : 1;
    const r = NODE_R*Math.min(cam.k,1.35)*pop*(n.parent?1:1.25);
    let alpha = dimmed && !onPath ? 0.16 : 1;
    alpha *= born;

    /* halo do selecionado / trace */
    if(isSel || (onPath && dimmed)){
      const rv = isSel?1:pathReveal(n)||((path.indexOf(n)===0)?1:0);
      ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha = (isSel?0.55+0.18*Math.sin(t*3):0.3)*rv;
      const hs=r*4.6;
      ctx.drawImage(SP_HALO, sx-hs/2, sy-hs/2, hs, hs);
      ctx.globalAlpha=1;
      ctx.globalCompositeOperation='source-over';
    }

    ctx.globalAlpha=alpha;
    /* orbe */
    const g=ctx.createRadialGradient(sx-r*0.3, sy-r*0.35, r*0.2, sx, sy, r);
    g.addColorStop(0,'#2c2312');
    g.addColorStop(1,'#120e08');
    ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2);
    ctx.fillStyle=g; ctx.fill();
    ctx.lineWidth = isSel?2.6:1.6;
    ctx.strokeStyle = isSel ? '#e8c078' : (String(n.id).startsWith('hist_')||String(n.id).startsWith('v_') ? 'rgba(123,158,201,0.8)' : '#8a6a34');
    ctx.stroke();

    /* iniciais */
    if(cam.k>0.3){
      ctx.fillStyle = onPath||!dimmed ? '#e8c078' : 'rgba(232,192,120,0.5)';
      ctx.font = `600 ${Math.max(9, r*0.62)}px ${fontsReady?'Fraunces':'serif'}, serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(initials(n.name), sx, sy+1);
    }
    /* nome + equipe */
    if(cam.k>0.42){
      ctx.fillStyle = dimmed&&!onPath ? 'rgba(241,231,211,0.25)' : '#f1e7d3';
      ctx.font = `500 ${11.5*Math.min(cam.k,1.15)}px ${fontsReady?'Fraunces':'serif'}, serif`;
      ctx.fillText(n.name, sx, sy+r+14*Math.min(cam.k,1.2));
      if(cam.k>0.75 && n.team){
        ctx.fillStyle = dimmed&&!onPath ? 'rgba(107,98,85,0.35)' : '#6b6255';
        ctx.font = `400 ${9.5*Math.min(cam.k,1.1)}px Inter, sans-serif`;
        ctx.fillText(n.team.length>26?n.team.slice(0,25)+'…':n.team, sx, sy+r+28*Math.min(cam.k,1.2));
      }
    }
    /* badge de colapso */
    const hidden = n._children ? countAll(n) : 0;
    if(hidden && cam.k>0.3){
      const by2=sy+r+ (cam.k>0.42? (cam.k>0.75&&n.team?40:26)*Math.min(cam.k,1.2) : 16);
      ctx.beginPath(); ctx.arc(sx,by2,10,0,Math.PI*2);
      ctx.fillStyle='#1d180f'; ctx.fill();
      ctx.strokeStyle='#8a6a34'; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle='#e8c078';
      ctx.font='600 8.5px Inter, sans-serif';
      ctx.fillText('+'+hidden, sx, by2+0.5);
      n._badgeY = by2; /* para hit test */
    }
    ctx.globalAlpha=1;
  });

  /* vinheta */
  if(vignette) ctx.drawImage(vignette,0,0);
}

/* (hit test de badge definido junto do handler de clique, acima) */

/* ============ seletor de árvore + busca ============ */
const treeSel=document.getElementById('tree-select');
FOREST.forEach((s,i)=>{
  const o=document.createElement('option');
  o.value=i; o.textContent=`${s.name} (${treeSizeRaw(s)})`;
  treeSel.appendChild(o);
});
treeSel.addEventListener('change', ()=>loadForest(+treeSel.value));

function loadForest(i){
  const src=FOREST[i];
  const n=treeSizeRaw(src);
  TREE=cloneTree(src,0, n>120?2:(n>40?3:6));
  layoutDirty=true;
  clearSelection();
  layout();
  visit(TREE,x=>{x.sx=x.x;x.sy=x.y;});
  seedPulses();
  cam.x=cam.tx=0; cam.y=cam.ty=H*0.3/0.8; cam.k=cam.tk=(n>120?0.62:0.8);
  camFlyTo(0, 240, cam.tk);
}

const sIn=document.getElementById('search'), sRes=document.getElementById('search-results');
const INDEX=[];
FOREST.forEach((s,ti)=>{ (function fl(n){ INDEX.push({n,ti}); (n.children||[]).forEach(fl); })(s); });
sIn.addEventListener('input', ()=>{
  const q=sIn.value.trim().toLowerCase();
  if(!q){ sRes.classList.remove('show'); return; }
  const m=INDEX.filter(x=>x.n.name.toLowerCase().includes(q)||(x.n.nickname||'').toLowerCase().includes(q)).slice(0,9);
  sRes.innerHTML=m.length?m.map(x=>`<div class="item" data-ti="${x.ti}" data-id="${x.n.id}">${x.n.name}<small>${x.n.team||''} · linhagem ${FOREST[x.ti].name}</small></div>`).join(''):`<div class="item">Nenhum resultado</div>`;
  sRes.classList.add('show');
  sRes.querySelectorAll('.item[data-id]').forEach(it=>{
    it.addEventListener('click', ()=>{
      const ti=+it.dataset.ti, id=it.dataset.id;
      sRes.classList.remove('show'); sIn.value='';
      if(+treeSel.value!==ti){ treeSel.value=ti; loadForest(ti); }
      /* expande ancestrais até o alvo */
      let f=null;
      visitAll(TREE,x=>{ if(x.id===id) f=x; });
      if(f){
        let c=f.parent;
        while(c){ if(c._children){ c.children=c._children; c._children=null; } c=c.parent; }
        layoutDirty=true; layout(); seedPulses();
        select(f);
        camFlyTo(f.x, f.y, 0.95);
      }
    });
  });
});
document.addEventListener('click', e=>{ if(!e.target.closest('.search-wrap')) sRes.classList.remove('show'); });

/* ============ init ============ */
resize();
loadForest(0);
requestAnimationFrame(frame);
setTimeout(()=>{ const h=document.getElementById('hint'); if(h) h.style.opacity='0'; }, 9000);
</script>
